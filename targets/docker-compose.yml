# ════════════════════════════════════════════════════════════════════
# MISC // shared practice-target range (isolated lab)
#
# Deliberately vulnerable apps for AUTHORIZED local testing of Round Table
# (and the other tools in this repo). Its own compose project so rebuilding
# any app never stops these targets.
#
#   Start:   docker compose -f targets/docker-compose.yml up -d
#   Stop:    docker compose -f targets/docker-compose.yml down
#   Status:  docker compose -f targets/docker-compose.yml ps
#   (or:  cd targets && docker compose up -d )
#
# Scan them from a tool via the Docker host gateway:
#   OWASP Juice Shop  ->  host.docker.internal:42000
#   DVWA              ->  host.docker.internal:42001
#   VAmPI (vuln API)  ->  host.docker.internal:42002
#
# Bound to 127.0.0.1 only — not exposed to your network.
# ════════════════════════════════════════════════════════════════════
name: misc-targets

services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:42000:3000"

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:42001:80"
    environment:
      # DVWA needs a database; point it at the mariadb service below.
      - DB_SERVER=dvwa-db
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
    depends_on:
      - dvwa-db

  dvwa-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    # not published to the host — only DVWA (same compose network) reaches it

  vampi:
    image: erev0s/vampi:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:42002:5000"
