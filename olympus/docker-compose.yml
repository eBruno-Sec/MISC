services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: olympus
      POSTGRES_USER: ${DB_USER:-olympus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-olympus_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-olympus-zap}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    expose:
      - "8090"
    # ZAP needs to reach the target too (e.g. host.docker.internal:42000).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-olympus}:${DB_PASSWORD:-olympus_secret}@postgres:5432/olympus
      REDIS_URL: redis://redis:6379
      # AI provider (anthropic or openrouter). All optional; blank disables AI.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # Backward-compat: still forwarded if set
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      OLYMPUS_API_KEY: ${OLYMPUS_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REPORTS_DIR: /app/reports
      # OWASP ZAP daemon (active DAST). Runs as the `zap` service below.
      ZAP_URL: http://zap:8090
      ZAP_API_KEY: ${ZAP_API_KEY:-olympus-zap}
      # Spider + OWASP scan breadth: number of live hosts covered per mission.
      OLYMPUS_OFFENSIVE_MAX_HOSTS: ${OLYMPUS_OFFENSIVE_MAX_HOSTS:-5}
    # Backend is reached only through the nginx proxy (frontend:3000 -> /api, /ws).
    # No host port is published, reducing the unauthenticated attack surface.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zap:
        condition: service_started
    volumes:
      - reports:/app/reports
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Lets the backend reach services on the host (e.g. a local Juice Shop
    # at host.docker.internal:42000). Works on Docker Desktop and Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  reports:
