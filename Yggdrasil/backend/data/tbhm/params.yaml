# TBHM-derived parameter catalog.
#
# Two tiers, so deep coverage is opt-in and default runs stay fast:
#   curated_default -> always-on high-signal names for parameter mining.
#   deep            -> bounded (~250), frequency-ranked names distilled OFFLINE
#                      from the marker-templated corpus (v4/all2.txt). Used only
#                      when deep mode is enabled (YGGDRASIL_TBHM_DEEP=1).
#
# Family classification itself lives in core/parameter_intelligence.py (the
# OWASP Top-25 lists); this file EXTENDS mining coverage, it does not re-derive
# classification. See references.yaml for attribution.
source: tbhm + owasp_top25_params + assetnote_style_param_corpus

# High-signal names appended during default-mode active parameter mining, on top
# of the engine's built-in candidates. Kept small on purpose.
curated_default:
  - id
  - page
  - file
  - dir
  - path
  - url
  - redirect
  - next
  - return
  - dest
  - q
  - s
  - search
  - query
  - cmd
  - exec
  - action
  - view
  - include
  - template
  - lang
  - callback
  - debug
  - token
  - key
  - user
  - username
  - email
  - admin
  - role
  - format
  - type
  - mode
  - src
  - doc
  - download
  - report
  - print
  - preview
  - order

