        mode: default
      - id: password-guessing
        text: Test resilience to password guessing
        coverage: partial
        agent: BROKKR
        mode: manual
        note: Target-flavored credential wordlist generated; actual guessing is operator-gated.
      - id: account-recovery
        text: Test any account recovery function
        coverage: manual
        agent: ""
        mode: manual
      - id: remember-me
        text: Test any "remember me" function
        coverage: manual
        agent: ""
        mode: manual
      - id: impersonation
        text: Test any impersonation function
        coverage: manual
        agent: ""
        mode: manual
      - id: username-uniqueness
        text: Test username uniqueness
        coverage: manual
        agent: ""
        mode: manual
      - id: credential-distribution
        text: Check for unsafe distribution of credentials
        coverage: partial
        agent: TYR
        mode: default
        note: Secrets-in-JS detection (jsluice/trufflehog) covers hardcoded credential exposure.
      - id: fail-open
        text: Test for fail-open conditions
        coverage: manual
        agent: ""
        mode: manual
      - id: multi-stage-auth
        text: Test any multi-stage mechanisms
        coverage: manual
        agent: ""
        mode: manual

  - id: access-session
