# TBHM / WAHH Fast Testing Checklist, mapped to Yggdrasil coverage.
#
# Each item records how Yggdrasil covers it:
#   coverage: automated | partial | manual
#   agent:    the Yggdrasil stage/tool responsible (Norse display names), or ""
#   mode:     default | deep | manual  (when the covering check runs)
#
# The report renders these as covered / partial / manual / not-applicable so an
# operator sees exactly what the automated pass did and did NOT do. See
# references.yaml for attribution (Jason Haddix TBHM + WAHH task checklist).
source: tbhm + wahh

categories:
  - id: recon
    title: App Recon and Analysis
    items:
      - id: map-visible-content
        text: Map visible content
        coverage: automated
        agent: HEIMDALL
        mode: default
      - id: discover-hidden-content
        text: Discover hidden & default content (directory/file brute force)
        coverage: automated
        agent: TYR
        mode: default
      - id: debug-parameters
        text: Test for debug parameters
        coverage: partial
        agent: TYR
        mode: deep
        note: Covered by parameter mining (debug/test/env candidates); deeper set in deep mode.
      - id: data-entry-points
        text: Identify data entry points
        coverage: automated
        agent: HEIMDALL
        mode: default
      - id: identify-technologies
        text: Identify the technologies used
        coverage: automated
        agent: HEIMDALL
        mode: default
      - id: research-known-vulns
        text: Research existing vulnerabilities in the technology
        coverage: partial
        agent: TYR
        mode: default
        note: nuclei templates + MIMIR correlation; not a substitute for manual CVE research.
      - id: tech-wordlists
        text: Gather wordlists specific to the technology
        coverage: automated
        agent: BROKKR
        mode: default
      - id: spider-attack-surface
        text: Map the attack surface automatically (spider)
        coverage: automated
        agent: HEIMDALL
        mode: default
      - id: identify-js-files
        text: Identify all JavaScript files for later analysis
        coverage: automated
        agent: TYR
        mode: default
        note: jsluice endpoint/secret extraction over same-host JS.

  - id: access-auth
    title: Access — Authentication
