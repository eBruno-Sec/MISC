name: yggdrasil

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yggdrasil}
      POSTGRES_USER: ${DB_USER:-yggdrasil}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yggdrasil_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yggdrasil} -d ${DB_NAME:-yggdrasil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    restart: unless-stopped
    # Daemon mode, reachable from other containers (host 0.0.0.0), API open to
    # the internal Docker network (addr.name/.regex) with its own key check
    # disabled — same "no host port published, internal-network-only" posture
    # as the backend service below, since ZAP is a same-network scan helper, not
    # a public-facing service. Set ZAP_API_KEY (optional; see .env.example) if
    # you want the backend to send an API key anyway for defense in depth — ZAP
    # itself does not require it in this default configuration.
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config api.disablekey=true
    expose:
      - "8090"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-yggdrasil}:${DB_PASSWORD:-yggdrasil_secret}@postgres:5432/${DB_NAME:-yggdrasil}
      REDIS_URL: redis://redis:6379
      # AI provider (anthropic or openrouter). All optional; blank disables AI.
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      # Backward-compat: still forwarded if set
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      YGGDRASIL_API_KEY: ${YGGDRASIL_API_KEY:-}
      OLYMPUS_API_KEY: ${OLYMPUS_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REPORTS_DIR: /app/reports

      YGGDRASIL_AUTO_APPROVE: ${YGGDRASIL_AUTO_APPROVE:-}
      YGGDRASIL_APPROVAL_TIMEOUT: ${YGGDRASIL_APPROVAL_TIMEOUT:-0}
      YGGDRASIL_OFFENSIVE_MAX_HOSTS: ${YGGDRASIL_OFFENSIVE_MAX_HOSTS:-5}
      YGGDRASIL_CIDR_MAX_HOSTS: ${YGGDRASIL_CIDR_MAX_HOSTS:-1024}
      YGGDRASIL_HEARTBEAT_SECONDS: ${YGGDRASIL_HEARTBEAT_SECONDS:-300}
      # OWASP ZAP active-scan daemon (see the zap service above). ZAP_API_KEY is
      # optional — the zap service's default config does not require one; set it
      # only if you've also hardened zap's own command with a matching api.key.
      ZAP_URL: http://zap:8090
      ZAP_API_KEY: ${ZAP_API_KEY:-}
    # Backend is reached only through the nginx proxy (frontend:3000 -> /api, /ws).
    # No host port is published, reducing the unauthenticated attack surface.
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started (not service_healthy): ZAP's own daemon init can take a
      # while, and offensive.py's zap_active_scan already polls ZAP's API with
      # its own bounded retry/timeout before using it. The backend must not block
      # its own startup — or every other scan phase — waiting on ZAP to warm up.
      zap:
        condition: service_started
    volumes:
      - reports:/app/reports
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Lets the backend reach services on the host (e.g. a local Juice Shop
    # at host.docker.internal:42000). Works on Docker Desktop and Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  reports:
