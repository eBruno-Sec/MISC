name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Re:Fit PWA
        run: |
          cd refit
          npm install
          npm run build
          cd ..
          cp -r refit/dist /tmp/refit-dist
          rm -rf refit
          mv /tmp/refit-dist refit
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_URL: /MISC/refit/

      - name: Build Tiny Knights
        run: |
          cd tiny-knights
          npm ci
          npm run build
          cd ..
          cp -r tiny-knights/dist /tmp/tiny-knights-dist
          rm -rf tiny-knights
          mv /tmp/tiny-knights-dist tiny-knights

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload entire repo as static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
