name: arsgoatia tests

on:
  push:
    branches: [ main ]
    paths: [ 'arsgoatia/**', '.github/workflows/arsgoatia-tests.yml' ]
  pull_request:
    paths: [ 'arsgoatia/**', '.github/workflows/arsgoatia-tests.yml' ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install --upgrade pip "ruff==0.15.8"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip \
            "pydantic>=2.6" "pydantic-settings>=2.2" "pyyaml>=6.0" "jsonschema>=4.21" \
            "sqlalchemy>=2.0" "asyncpg>=0.29" "fastapi>=0.110" "httpx>=0.27" \
            "cryptography>=42" pytest "pytest-asyncio>=0.23"
      - name: Run tests
        run: python -m pytest tests/unit tests/contract tests/security tests/integration tests/isolation tests/performance -q

  replay:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --upgrade pip "pydantic>=2.6" "pydantic-settings>=2.2" "temporalio>=1.6" pytest
      - name: Run replay tests
        run: python -m pytest tests/replay -q

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bring up the full stack
        run: |
          cp .env.example .env
          docker compose -f deploy/compose/docker-compose.yml --profile core --profile ui --profile lab up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health; then echo ready; break; fi
            sleep 5
          done
      - name: Apply migrations
        run: docker compose -f deploy/compose/docker-compose.yml exec -T api alembic upgrade head
      - name: Install e2e client + run
        run: |
          python -m pip install --upgrade pip pytest "httpx>=0.27"
          ARSGOATIA_API_URL=http://localhost:8080 python -m pytest tests/e2e -q
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=200
