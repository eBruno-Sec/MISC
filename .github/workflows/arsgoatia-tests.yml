name: arsgoatia tests

on:
  push:
    branches: [ main ]
    paths: [ 'arsgoatia/**', '.github/workflows/arsgoatia-tests.yml' ]
  pull_request:
    paths: [ 'arsgoatia/**', '.github/workflows/arsgoatia-tests.yml' ]
  workflow_dispatch:

jobs:
  pytest:
    # Unit + contract + security tests (pure logic; no external services).
    # tests/replay and tests/e2e self-skip here (temporalio/httpx absent).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: python -m pip install --upgrade pip "pydantic>=2.6" "pydantic-settings>=2.2" "pyyaml>=6.0" "jsonschema>=4.21" "sqlalchemy>=2.0" pytest
      - name: Run tests
        run: python -m pytest tests/unit tests/contract tests/security -q

  replay:
    # Temporal determinism/replay tests. temporalio pulls its test server;
    # the tests skip gracefully if it cannot start.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install --upgrade pip "pydantic>=2.6" "pydantic-settings>=2.2" "temporalio>=1.6" pytest
      - name: Run replay tests
        run: python -m pytest tests/replay -q

  e2e:
    # Full lab slice against OWASP Juice Shop. Heavy; run on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bring up the lab stack
        run: |
          cp .env.example .env
          docker compose --profile lab up --build -d
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz; then echo ready; break; fi
            sleep 5
          done
      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head
      - name: Install e2e client + run
        run: |
          python -m pip install --upgrade pip pytest "httpx>=0.27"
          ARSGOATIA_API_URL=http://localhost:8080 python -m pytest tests/e2e -q
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
