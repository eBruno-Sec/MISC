name: arsgoatia tests

on:
  push:
    branches: [ main ]
    paths: [ 'arsgoatia/**', '.github/workflows/arsgoatia-tests.yml' ]
  pull_request:
    paths: [ 'arsgoatia/**', '.github/workflows/arsgoatia-tests.yml' ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arsgoatia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Contract/unit/policy/replay tests. The heavier runtime deps (temporalio,
      # sqlalchemy, boto3, fastapi) are added to this install as the milestones
      # that need them land; today's suite is the schema + module contracts.
      - name: Install test deps
        run: python -m pip install --upgrade pip "pydantic>=2.6" "pyyaml>=6.0" "jsonschema>=4.21" pytest
      - name: Run tests
        run: python -m pytest tests/ -q
