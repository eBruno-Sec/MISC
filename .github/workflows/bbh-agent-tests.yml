name: bbh-agent tests

on:
  push:
    branches: [ main ]
    paths: [ 'bbh-agent/**', '.github/workflows/bbh-agent-tests.yml' ]
  pull_request:
    paths: [ 'bbh-agent/**', '.github/workflows/bbh-agent-tests.yml' ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The suite is pure/deterministic — all httpx/anthropic/openai/playwright
      # imports are lazy inside transport methods, so it runs with just pytest
      # (httpx pinned for any incidental import).
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest "httpx[http2]>=0.27.0"
      - name: Run tests
        run: python -m pytest bbh-agent/agent/tests/ -q
