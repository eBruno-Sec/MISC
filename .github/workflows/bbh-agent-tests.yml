name: bbh-agent tests

on:
  push:
    branches: [ main ]
    paths: [ 'bbh-agent/**', '.github/workflows/bbh-agent-tests.yml' ]
  pull_request:
    paths: [ 'bbh-agent/**', '.github/workflows/bbh-agent-tests.yml' ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The analyzers are pure, but the agent-gate tests construct BBHAgent, whose
      # __init__ builds the provider client — so openai + anthropic are needed.
      # (fastapi/playwright stay out: main.py and the browser pass aren't tested.)
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest "httpx[http2]>=0.27.0" openai anthropic
      - name: Run tests
        run: python -m pytest bbh-agent/agent/tests/ -q
