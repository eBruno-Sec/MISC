name: apolaki tests

on:
  push:
    branches: [ main ]
    paths: [ 'apolaki/**', '.github/workflows/apolaki-tests.yml' ]
  pull_request:
    paths: [ 'apolaki/**', '.github/workflows/apolaki-tests.yml' ]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The analyzers are pure, but the agent-gate tests construct BBHAgent, whose
      # __init__ builds the provider client — so openai + anthropic are needed.
      # (fastapi/playwright stay out: main.py and the browser pass aren't tested.)
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest "httpx[http2]>=0.27.0" openai anthropic fastapi python-multipart
      - name: Run tests
        run: python -m pytest apolaki/agent/tests/ -q
