<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedFlag — Relationship Patterns, Plainly Explained</title>
<meta name="description" content="Learn to read relationship red flags — the behavioral patterns behind them, plainly explained, plus a private quiz, a screening finder, and a printable report. Free, anonymous, nothing leaves your device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2312100E'/%3E%3Crect x='20' y='28' width='60' height='12' rx='6' fill='%23C0392B'/%3E%3Crect x='20' y='44' width='60' height='12' rx='6' fill='%23C0392B' opacity='.7'/%3E%3Crect x='20' y='60' width='60' height='12' rx='6' fill='%23C0392B' opacity='.4'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

:root{
  --bg:#12100E; --bg-1:#1A1712; --bg-2:#221D17; --bg-card:#1B1712;
  --line:#322A22; --line-soft:#241E18;
  --accent:#C0392B; --accent-bright:#E0655A; --accent-glow:rgba(192,57,43,.14);
  --green:#4B7B5C; --green-soft:rgba(75,123,92,.16);
  --ink:#F1EAE0; --ink-dim:#B3A79A; --ink-faint:#7A6E60;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Source Sans 3',system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:'Space Mono','SFMono-Regular',Menlo,monospace;
  --max:1180px; --narrow:760px;
  --radius:9px; --radius-lg:16px; --pill:999px;
  --shadow:0 2px 14px rgba(0,0,0,.4); --shadow-hover:0 10px 34px rgba(0,0,0,.5), 0 0 0 1px var(--accent);
}
:root[data-theme="light"]{
  --bg:#F7F5F2; --bg-1:#FFFFFF; --bg-2:#F1EDE8; --bg-card:#FFFFFF;
  --line:rgba(0,0,0,.12); --line-soft:rgba(0,0,0,.07);
  --accent:#C0392B; --accent-bright:#A5342A; --accent-glow:rgba(192,57,43,.08);
  --green:#2E7D46; --green-soft:rgba(46,125,70,.10);
  --ink:#1A1614; --ink-dim:#574F4B; --ink-faint:#938A85;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 26px rgba(0,0,0,.06); --shadow-hover:0 10px 30px rgba(0,0,0,.10),0 0 0 1px var(--accent);
}
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;} }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased; }
#root{ min-height:100vh; }
a{ color:inherit; text-decoration:none; }
::selection{ background:var(--accent-glow); }
::-webkit-scrollbar{ width:11px; } ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; border:3px solid var(--bg); }

h1,h2,h3,h4{ font-family:var(--display); font-weight:500; line-height:1.14; letter-spacing:-.01em; margin:0 0 .5em; color:var(--ink); }
.eyebrow{ display:inline-block; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent-bright); margin-bottom:14px; }

/* ── App frame ── */
.rf-app{ min-height:100vh; display:flex; flex-direction:column; }
.rf-main{ flex:1 0 auto; }
.container{ width:100%; max-width:var(--max); margin:0 auto; padding:0 28px; }
.narrow{ max-width:var(--narrow); }
.view{ padding:44px 0 72px; }

/* ── Header / nav ── */
.site-header{ position:sticky; top:0; z-index:60; background:color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
.nav{ max-width:var(--max); margin:0 auto; padding:13px 28px; display:flex; align-items:center; gap:18px; }
.brand{ display:flex; align-items:center; gap:9px; font-family:var(--display); font-size:19px; font-weight:600; letter-spacing:-.01em; cursor:pointer; background:none; border:none; color:var(--ink); }
.nav-links{ display:flex; align-items:center; gap:2px; margin-left:auto; list-style:none; padding:0; }
.nav-links button{ background:none; border:none; color:var(--ink-dim); font-family:var(--body); font-size:14px; font-weight:500; padding:8px 12px; border-radius:var(--radius); cursor:pointer; white-space:nowrap; transition:.13s; }
.nav-links button:hover{ color:var(--ink); background:var(--accent-glow); }
.nav-links button.active{ color:var(--accent-bright); }
.nav-actions{ display:flex; align-items:center; gap:8px; }
.nav-cta{ background:var(--accent); color:#fff; border:none; font-family:var(--body); font-weight:600; font-size:14px; padding:9px 16px; border-radius:var(--pill); cursor:pointer; white-space:nowrap; }
.nav-cta:hover{ filter:brightness(1.08); }
.icon-btn{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-2); color:var(--ink); cursor:pointer; font-size:15px; }
.nav-toggle{ display:none; width:40px; height:40px; border:1px solid var(--line); background:var(--bg-2); border-radius:var(--radius); color:var(--ink); cursor:pointer; align-items:center; justify-content:center; }

/* ── Hero ── */
.hero{ padding:64px 0 34px; }
.hero-grid{ display:grid; grid-template-columns:1.08fr .92fr; gap:56px; align-items:center; }
.hero h1{ font-size:clamp(36px,5vw,60px); font-weight:400; letter-spacing:-.02em; margin-bottom:20px; }
.sub{ font-size:18px; line-height:1.7; color:var(--ink-dim); max-width:54ch; }
.hero-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-top:28px; }
.hero-note{ font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); margin-top:18px; letter-spacing:.02em; }
.hero-visual{ display:flex; justify-content:center; }
.mockcard{ width:100%; max-width:380px; background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow); }
.mockcard-top{ display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:18px; }
.mockrow{ display:flex; align-items:center; justify-content:space-between; font-size:13.5px; font-weight:500; margin-bottom:6px; }
.mockcode{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent-bright); letter-spacing:1px; }
.mockbar{ height:6px; background:var(--bg-2); border-radius:4px; overflow:hidden; margin-bottom:15px; }
.mockbar>i{ display:block; height:100%; background:var(--accent); }
.mockclash{ margin-top:4px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--display); font-style:italic; font-size:13px; color:var(--ink-dim); }

/* ── Sections ── */
.section{ padding:40px 0; }
.section-head{ max-width:640px; margin-bottom:26px; }
.section-head h2{ font-size:clamp(26px,3.4vw,38px); font-weight:400; }
.section-head p{ color:var(--ink-dim); font-size:16.5px; margin:6px 0 0; }
.grid{ display:grid; gap:18px; }
.grid-2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.grid-3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; transition:.15s; }
button.card{ text-align:left; cursor:pointer; color:inherit; font-family:inherit; width:100%; }
button.card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-hover); }
.card h3{ font-size:20px; margin-bottom:8px; }
.card p{ color:var(--ink-dim); font-size:14.5px; margin:0 0 14px; }
.card-link{ font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent-bright); letter-spacing:.04em; }
.card-glyph{ width:34px; height:34px; margin-bottom:14px; color:var(--accent); }

/* ── Prose (educational) ── */
.prose{ max-width:var(--narrow); }
.prose > p, .prose li{ color:var(--ink-dim); font-size:16.5px; line-height:1.75; }
.prose > p{ margin:0 0 1.05em; }
.prose h3{ font-size:24px; margin:1.7em 0 .5em; }
.prose h3:first-child{ margin-top:0; }
.lead{ font-size:19px; line-height:1.6; color:var(--ink); font-family:var(--display); font-weight:400; }
.prose ul{ list-style:none; margin:.4em 0 1.2em; padding:0; }
.prose ul li{ position:relative; padding:5px 0 5px 22px; }
.prose ul li::before{ content:""; position:absolute; left:2px; top:14px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.callout{ border-left:3px solid var(--accent); background:var(--accent-glow); border-radius:0 var(--radius) var(--radius) 0; padding:16px 20px; margin:1.4em 0; }
.callout.is-safe{ border-color:var(--green); background:var(--green-soft); }
.callout h4{ font-family:var(--body); font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--ink); margin:0 0 6px; }
.callout p{ color:var(--ink-dim); font-size:15px; margin:0; }
.contrast{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:1.2em 0; }
.contrast .col{ border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.contrast .col h4{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 8px; }
.contrast .green h4{ color:var(--green); } .contrast .red h4{ color:var(--accent-bright); }
.contrast .col p{ font-size:14px; color:var(--ink-dim); margin:0 0 6px; line-height:1.55; }

/* ── Pattern family blocks ── */
.family{ margin-bottom:14px; }
.family-blurb{ color:var(--ink-dim); font-size:15.5px; line-height:1.7; margin:2px 0 14px; max-width:70ch; }
.pat{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; }
.pat-name{ font-family:var(--display); font-size:17px; font-weight:500; }
.pat-clin{ font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; color:var(--ink-faint); text-transform:uppercase; margin:2px 0 7px; }
.pat-desc{ color:var(--ink-dim); font-size:14px; line-height:1.6; margin:0; }

/* ── Lens (frameworks) ── */
.lens{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px 24px; }
.lens-tag{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-bright); }
.lens h3{ font-size:21px; margin:6px 0 8px; }
.lens p{ color:var(--ink-dim); font-size:15px; line-height:1.7; margin:0 0 8px; }
.lens .toxic{ font-size:14px; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
.lens .toxic b{ color:var(--accent-bright); font-weight:600; }

/* ── Buttons ── */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--body); font-weight:600; font-size:15px; border-radius:var(--pill); border:1px solid transparent; cursor:pointer; padding:0 24px; min-height:50px; transition:.14s; }
.btn:disabled{ opacity:.4; cursor:not-allowed; }
.btn-primary{ background:var(--accent); color:#fff; }
.btn-primary:not(:disabled):hover{ filter:brightness(1.08); }
.btn-solid{ background:var(--ink); color:var(--bg); }
.btn-solid:not(:disabled):hover{ opacity:.9; }
.btn-outline{ background:transparent; border-color:var(--line); color:var(--ink); }
.btn-outline:not(:disabled):hover{ background:var(--bg-2); border-color:var(--ink-faint); }
.btn-ghost{ background:none; border:none; color:var(--ink-dim); min-height:40px; padding:0 6px; font-weight:600; font-size:14px; cursor:pointer; }
.btn-ghost:hover{ color:var(--ink); }
.btn-block{ width:100%; }
.mt{ margin-top:18px; }

/* ── Pills / tabs ── */
.pills{ display:flex; flex-wrap:wrap; gap:9px; margin:16px 0 22px; }
.pill{ font-family:var(--body); font-weight:600; font-size:13.5px; padding:9px 16px; min-height:44px; border-radius:var(--pill); border:1px solid var(--line); background:transparent; color:var(--ink-dim); cursor:pointer; transition:.12s; }
.pill:hover{ color:var(--ink); border-color:var(--ink-faint); }
.pill.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:20px; }
.tab{ flex:0 0 auto; font-family:var(--body); font-weight:600; font-size:13px; padding:9px 16px; min-height:42px; border-radius:var(--pill); border:1px solid var(--line); background:var(--bg-2); color:var(--ink-dim); cursor:pointer; white-space:nowrap; }
.tab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

/* ── Quiz ── */
.quiz{ max-width:680px; margin:0 auto; }
.progress{ height:5px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:18px; }
.progress>i{ display:block; height:100%; background:var(--accent); transition:width .3s; }
.quiz-meta{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; font-family:var(--mono); font-size:12px; color:var(--ink-faint); }
.opt{ display:block; width:100%; text-align:left; padding:15px 18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-card); cursor:pointer; font-family:var(--body); font-size:15px; line-height:1.5; color:var(--ink); margin-bottom:10px; transition:.12s; }
.opt:hover{ border-color:var(--ink-faint); }
.opt.sel{ background:var(--accent); color:#fff; border-color:var(--accent); }
.hint{ font-family:var(--display); font-style:italic; font-size:14px; color:var(--ink-faint); margin-bottom:16px; }

/* ── Choice / pick cards ── */
.choice{ cursor:pointer; }
.choice.sel{ border-color:var(--accent); background:var(--accent-glow); }
.choice .cl{ font-size:15px; font-weight:600; color:var(--ink); }
.choice .cs{ font-size:13px; color:var(--ink-dim); margin-top:4px; }
.center{ display:flex; align-items:center; justify-content:center; min-height:58px; font-size:15px; font-weight:600; }
.inline-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.summary-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:22px; }
.counter{ font-family:var(--mono); font-size:24px; font-weight:700; color:var(--ink-faint); }
.counter.ok{ color:var(--green); } .counter.warn{ color:var(--accent-bright); }
.pick{ display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
.pick.sel{ border-color:var(--accent); background:var(--accent-glow); }
.pick.locked{ opacity:.4; cursor:not-allowed; }
.pick-box{ width:20px; height:20px; border-radius:5px; border:1.5px solid var(--ink-faint); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; }
.pick.sel .pick-box{ background:var(--accent); border-color:var(--accent); }
.pick-name{ font-family:var(--display); font-size:15px; font-weight:500; line-height:1.3; }
.pick-one{ font-size:12.5px; color:var(--ink-dim); margin-top:3px; line-height:1.5; }
.sticky-cta{ position:sticky; bottom:0; padding:16px 0 6px; margin-top:18px; background:linear-gradient(to top, var(--bg) 72%, transparent); }

/* ── Results ── */
.results{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:34px; align-items:start; }
.side{ position:sticky; top:90px; display:flex; flex-direction:column; gap:10px; }
.side-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px; }
.sec-h{ font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 14px; }
.notice{ padding:12px 16px; border-left:3px solid var(--line); background:var(--bg-2); font-size:13.5px; line-height:1.6; color:var(--ink-dim); border-radius:0 var(--radius) var(--radius) 0; margin-bottom:16px; }
.notice.danger{ border-color:var(--accent); background:var(--accent-glow); color:var(--ink); }
.combined{ background:var(--accent-glow); border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; }
.combined .l{ font-family:var(--mono); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--accent-bright); margin-bottom:2px; }
.combined .v{ font-family:var(--display); font-size:16px; color:var(--accent-bright); }
.arc.clean{ opacity:.5; }
.arc-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:8px; }
.arc-name{ font-family:var(--display); font-size:16px; font-weight:500; }
.arc-clin{ font-family:var(--mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-faint); margin-top:2px; }
.arc-desc{ color:var(--ink-dim); font-size:13.5px; line-height:1.6; margin:0; }
.tag-new{ margin-left:8px; font-family:var(--mono); font-size:9.5px; background:var(--bg-2); color:var(--ink-dim); border-radius:var(--pill); padding:2px 8px; }
.badge{ display:inline-flex; align-items:center; padding:3px 11px; border-radius:var(--pill); font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.03em; white-space:nowrap; }
.badge.healthy{ background:var(--green-soft); color:var(--green); } .badge.watch{ background:#4a3a1a; color:#e0b24b; }
.badge.address{ background:#4a2420; color:#e08a7e; } .badge.severe{ background:var(--accent); color:#fff; }
:root[data-theme="light"] .badge.watch{ background:#FDEBD0; color:#7B4A0A; } :root[data-theme="light"] .badge.address{ background:#FADBD8; color:#7B1A13; }
.crisisbox{ background:var(--accent); color:#fff; border-radius:var(--radius-lg); padding:20px; text-align:center; margin-bottom:16px; }
.crisisbox .n{ font-family:var(--mono); font-size:24px; font-weight:700; margin:4px 0; }
.affirm{ background:var(--green-soft); border:1px solid var(--green); border-radius:var(--radius-lg); padding:22px; text-align:center; margin-bottom:16px; }
.affirm p{ font-family:var(--display); font-size:16px; color:var(--ink); line-height:1.5; margin:0; }
.divider{ height:1px; background:var(--line); margin:22px 0; }
.list-item{ display:flex; gap:11px; padding:8px 0; }
.list-item + .list-item{ border-top:1px solid var(--line-soft); }
.dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:9px; }
.hang{ padding-left:13px; border-left:2px solid var(--line); margin-bottom:8px; font-size:14.5px; line-height:1.6; color:var(--ink-dim); }
.actions{ display:flex; flex-direction:column; gap:10px; max-width:420px; }

/* ── Footer ── */
.site-footer{ flex-shrink:0; border-top:1px solid var(--line); background:var(--bg-1); }
.footer-inner{ max-width:var(--max); margin:0 auto; padding:30px 28px; display:grid; grid-template-columns:1.4fr 1fr; gap:16px 40px; font-size:13px; line-height:1.65; color:var(--ink-faint); }
.footer-inner strong{ color:var(--ink-dim); }
.footer-links{ display:flex; flex-wrap:wrap; gap:6px 18px; }
.footer-links button{ background:none; border:none; color:var(--ink-dim); font:inherit; cursor:pointer; padding:0; }
.footer-links button:hover{ color:var(--accent-bright); }

/* ── Printable report (Section III: ink-saver, print-safe) ── */
.rf-report{ background:#FFF; color:#000; font-family:Helvetica,Arial,sans-serif; line-height:1.5; max-width:760px; margin:0 auto; }
.rf-report .rf-doc-title{ font-size:24px; font-weight:700; margin:0 0 2px; letter-spacing:-.01em; color:#000; }
.rf-report .rf-doc-sub{ font-size:13px; color:#000; margin:0 0 4px; }
.rf-report .rf-doc-meta{ font-size:11px; color:#333; margin:0 0 12px; }
.rf-report .rf-rule{ border:0; border-top:1px solid #000; margin:14px 0; }
.rf-report h2.rf-sec{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; margin:18px 0 8px; color:#000; }
.rf-report .rf-legend{ display:flex; flex-wrap:wrap; gap:4px 16px; font-size:11px; margin:0 0 6px; }
.rf-report .rf-legend span{ white-space:nowrap; color:#000; }
.rf-code{ font-family:"Courier New",Courier,monospace; font-weight:700; font-size:12px; letter-spacing:1px; white-space:nowrap; color:#000; }
.rf-report .rf-summary{ border:1px solid #000; border-radius:6px; padding:12px 14px; margin:0 0 14px; }
.rf-report .rf-block{ border:1px solid #000; border-radius:6px; padding:12px 14px; margin:0 0 12px; }
.rf-report .rf-block-name{ font-size:15px; font-weight:700; margin:0; color:#000; }
.rf-report .rf-block-clin{ font-size:11px; color:#333; margin:1px 0 6px; }
.rf-report .rf-block-desc{ font-size:12.5px; margin:0 0 8px; color:#000; }
.rf-report .rf-sev-severe{ border-left:7px solid #000; } .rf-report .rf-sev-address{ border-left:5px solid #000; }
.rf-report .rf-sev-watch{ border-left:3px solid #000; } .rf-report .rf-sev-healthy{ border-left:1px dashed #777; }

<script type="text/babel">
const { useState, useEffect, useMemo, createContext, useContext } = React;

// ─── SESSION PERSISTENCE (Section IV.1) ────────────────────────────────────────
const SESSION_KEY = "rf-session-v1";
function loadSession() { try { return JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; } }
function saveSession(o) { try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(o)); } catch (e) {} }
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }

// ─── THEME (default dark, editorial — like Inner Compass) ───────────────────────
const ThemeCtx = createContext({ dark:true, toggle:()=>{} });
function useThemeState() {
  const [dark, setDark] = useState(()=>{ try { const v=localStorage.getItem("rf-dark"); return v===null?true:v==="1"; } catch (e) { return true; } });
  useEffect(()=>{ try { document.documentElement.setAttribute("data-theme", dark?"dark":"light"); } catch (e) {} }, [dark]);
  return { dark, toggle:()=>setDark(d=>{ const n=!d; try { localStorage.setItem("rf-dark", n?"1":"0"); } catch (e) {} return n; }) };
}

// ─── ARCHETYPES ───────────────────────────────────────────────────────────────
const ARC = {

  blame:       { street:"Nothing Is Ever Their Fault",clinical:"Perpetual victim / DARVO",           one:"Every argument ends with you apologizing for something they did",                                kids:false, max:6  },
  somatic:     { street:"The Fragile One",            clinical:"Somatic manipulation",               one:"Uses real or exaggerated illness to shut down conflict and avoid accountability",                 kids:false, max:9  },
  jealousy:    { street:"The Suspicious One",         clinical:"Pathological jealousy",              one:"Constantly accuses you of cheating with no real basis",                                          kids:false, max:9  },
  religious:   { street:"The Holy Manipulator",       clinical:"Religious or cultural coercion",     one:"Uses God, scripture, or family honor to justify control",                                        kids:false, max:9  },
  humiliation: { street:"The Embarrasser",            clinical:"Public humiliation pattern",         one:"Degrades you in front of others or weaponizes your reputation",                                  kids:false, max:9  },
  rage:        { street:"The Volcano",                clinical:"Explosive anger pattern",            one:"Unpredictable outbursts followed by remorse — you never know which version you'll get",          kids:false, max:9  },
  gatekeeper:  { street:"The Gatekeeper",             clinical:"Parental alienation",                one:"Uses your children as weapons — turning them against you or withholding access",                 kids:true,  max:9  },
};

const COMBINED = {
  gaslight:    { passive:"Coercive Emotional Avoidance", control:"Reality-Based Coercive Control", emotional:"Comprehensive Reality Distortion", narcissistic:"Ego-Driven Reality Manipulation", blame:"The DARVO Loop" },
  control:     { passive:"Indirect Dominance Pattern", emotional:"Isolation and Suppression Pattern", financial:"Total Control Pattern", gatekeeper:"Parental Hostage Pattern" },
  lovebomb:    { gaslight:"Idealize-Devalue-Confuse Cycle", narcissistic:"The Charming Predator", control:"Romantic Coercion Pattern" },
  stone:       { passive:"Double Shutdown Pattern" },
  emotional:   { passive:"Chronic Invalidation Pattern", somatic:"Weaponized Fragility" },
  narcissistic:{ financial:"Entitled Exploitation Pattern", blame:"The Eternal Victim Who Causes Everything", humiliation:"The Status Predator" },
  financial:   { isolation:"Total Dependency Pattern" },
  intimidation:{ sexual:"Physical and Sexual Coercion Pattern", rage:"Escalating Violence Pattern" },
  blame:       { gaslight:"The DARVO Loop" },
  jealousy:    { control:"Obsessive Possession Pattern" },
  religious:   { control:"Sacred Cage Pattern" },
  rage:        { lovebomb:"The Cycle of Violence" },
  humiliation: { narcissistic:"Public Predator Pattern" },
  somatic:     { emotional:"Weaponized Fragility" },
};

const ARC_DESC = {
  gaslight:    "Making someone doubt their own memory, perception, or sanity through denial, contradiction, or minimization.",
  control:     "Limiting a partner's freedom through monitoring, guilt, jealousy, or punishment for independent behavior.",
  emotional:   "Treating a partner's emotions as burdens, weaknesses, or attacks rather than valid human experiences.",
  lovebomb:    "Cycles of intense affection followed by withdrawal — keeping a partner chasing the relationship's early feeling.",
  stone:       "Shutting down, going silent, or refusing to engage during conflict as a consistent pattern.",
  passive:     "Expressing frustration indirectly through behavior — silent treatment, forgetting, small digs.",
  identity:    "Using a partner's background, identity, or insecurities against them to diminish self-worth.",
  narcissistic:"Consistent self-centering — conversation hijacking, entitlement, inability to acknowledge mistakes.",
  financial:   "Using money to limit a partner's independence through controlling access or weaponizing financial decisions.",
  intimidation:"Using physical size, proximity, or property destruction to create fear without necessarily making contact.",
  sexual:      "Using intimacy as leverage or ignoring a partner's limits through persistence, guilt, or implied consequences.",
  isolation:   "Systematically reducing a partner's connections to friends and family, creating dependency.",
  blame:       "Perpetual victimhood and DARVO — the person who raises a concern ends up apologizing for raising it.",
  somatic:     "Using real or exaggerated physical illness to halt conflict, avoid accountability, and create guilt.",
  jealousy:    "Persistent unfounded accusations of cheating or infidelity that no reassurance can resolve.",
  religious:   "Using faith, scripture, or cultural tradition as tools of control rather than shared values.",
  humiliation: "Degrading a partner in public, sharing private information, or building status by tearing them down.",
  rage:        "Explosive disproportionate anger followed by remorse — a cycle that keeps a partner walking on eggshells.",
  gatekeeper:  "Using children as leverage — withholding access, undermining the parenting relationship, or threatening custody.",
};

// ─── ARCHETYPE DEEP-DIVE DATA ─────────────────────────────────────────────────
const ARC_DETAIL = {
  gaslight:{
    what:`Gaslighting is a sustained pattern in which one person repeatedly distorts or denies a shared reality so that the other begins to doubt their own perception, memory, and judgment. The term comes from the 1944 film Gaslight, in which a husband secretly dims the gas lights and then insists his wife is imagining the flicker. In practice it ranges from flat denial (“that never happened”) through subtle reframing (“you always make things dramatic”) to outright reversal (“I only said that because you pushed me to it”).`,
    develops:`Clinically, gaslighting overlaps with coercive control, narcissistic relational patterns, and learned DARVO (Deny, Attack, Reverse Victim and Offender). It rarely starts fully formed. It usually begins as a defense mechanism — the person deflects one difficult conversation, sees that it works, and gradually systemizes it. In personality research it correlates with low trait Agreeableness and high Machiavellianism.`,
    feels:`Targets describe a creeping erosion of self-trust. You replay the conversation three times before bed trying to figure out what actually happened. You stop raising concerns because every attempt ends with you apologizing. You catch yourself pre-clearing your version of events with a third party before you feel safe saying it out loud. Researchers describe this experience as “epistemic coercion” — your access to your own knowledge is being managed by someone else.`,
    research:`Jennifer Freyd’s betrayal trauma theory (1996) explains why targets of gaslighting by a trusted partner are especially slow to name it: the very attachment that makes the relationship matter also suppresses threat-detection. More recently, Sweet (2019) in Gender & Society documented how digital tools (screenshots, message histories) are increasingly weaponized in intimate-partner gaslighting.`,
    respond:[`Keep a brief private log — even just timestamps and one-line summaries of conversations — not to litigate, but to re-anchor your own memory.`,`Name the pattern by its impact, not their motive: “I need you to confirm what happened, because I keep ending up confused after we talk.”`,`If a trusted person outside the relationship consistently sees what you see, weight that signal.`]
  },
  control:{
    what:`Coercive control is a pattern of ongoing behavior designed to dominate a partner’s autonomy through monitoring, restriction, micromanagement, and consequences for independence. Evan Stark, who coined the term, distinguishes it from episodic violence: coercive control is continuous, atmospheric — it shapes the entire texture of daily life rather than occurring as isolated incidents.`,
    develops:`Control patterns typically escalate in stages. Early presentations look like protectiveness, “caring” jealousy, or intense investment. Over time the monitoring expands (location tracking, contact checking), the permissions narrow, and the cost of independent behavior rises. Stark’s 2007 research found that in relationships with coercive control, the controlling partner’s behavior intensifies at transitions — pregnancy, job changes, attempts to leave.`,
    feels:`Partners describe losing the ability to make even small decisions without calculating the aftermath. Which friend is safe to text. Whether to mention an after-work drink. A constant background cost-benefit analysis before every action. Lundy Bancroft calls this “walking on eggshells.” The cumulative weight of small restrictions is often more disorienting than any single incident.`,
    research:`Stark’s Coercive Control (2007) remains the foundational text. The UK Serious Crime Act 2015 became the first legislation to criminalize coercive control as a pattern rather than requiring proof of physical violence — a recognition that the harm is structural and cumulative, not incident-by-incident.`,
    respond:[`Trust the pattern, not the incident — if independence consistently creates consequences, the pattern is the data.`,`Financial and social independence (your own account, your own friendships) are not negotiable ground; they are safety infrastructure.`,`Specialist domestic abuse services (not general couples counseling) are the appropriate resource here — couples counseling can increase danger when coercive control is present.`]
  },
  emotional:{
    what:`Emotional invalidation as a persistent pattern involves treating a partner’s feelings as exaggerations, attacks, or weaknesses rather than as valid experiences. This goes beyond the ordinary friction of two people with different emotional registers; it is the consistent communication that having feelings is itself a problem.`,
    develops:`This pattern often originates in dismissive or avoidant attachment formed in early care environments. People who were parented by emotionally unavailable caregivers frequently internalize the message that emotions are dangerous or excessive. In adulthood this manifests as discomfort — sometimes genuine — when a partner expresses distress, which then gets managed by deflecting, minimizing, or blaming.`,
    feels:`Partners describe pre-editing their emotional expression before they dare say anything. The loss isn’t just feeling unsupported — it’s the slow disappearance of the capacity to trust your own emotional responses.`,
    research:`John Gottman’s longitudinal research on couple dynamics identifies contempt (which includes emotional invalidation) as the single strongest predictor of relationship dissolution — more predictive than conflict frequency or intensity. Invalidation specifically is associated with increased anxiety and depressive symptoms in the partner who receives it (Shenk & Fruzzetti, 2011).`,
    respond:[`Name the impact, not the intention: “When I share something hard and it gets minimized, I stop wanting to share. That affects us.”`,`Test whether repair is possible by sharing a small, low-stakes feeling and watching what happens.`,`A therapist who specializes in attachment can be invaluable — for both people — if the pattern is rooted in early experience rather than contempt.`]
  },
  lovebomb:{
    what:`Love bombing is the deployment of intense, premature affection — gifts, declarations, constant contact, future-planning — early in a relationship, followed eventually by withdrawal or devaluation. The intensity is strategic (consciously or not) rather than genuine: it creates attachment quickly, and the subsequent withdrawal leverages that attachment as a leash.`,
    develops:`Love bombing is closely associated with narcissistic and borderline attachment patterns. The idealization-devaluation cycle was first described in object relations theory (Kernberg, 1975) and maps directly onto the love-bomb-withdraw pattern: the person is either pedestalized or discarded, with little stable middle ground. The neurochemical hook is real — intermittent reinforcement creates stronger attachment than consistent positive reinforcement.`,
    feels:`Targets describe an initial experience of “finally” — finally someone who really sees me, who matches my intensity, who knows immediately that this is real. The disillusionment that follows is therefore doubly destabilizing: not only is the relationship painful, but your own initial read of it feels humiliated.`,
    research:`Intermittent reinforcement (B.F. Skinner’s variable ratio schedule) is the most resistance-to-extinction reinforcement pattern identified in behavioral research. Applied to attachment, this is why the push-pull cycle of love bombing creates bonds that are paradoxically stronger — and harder to leave — than consistently warm relationships.`,
    respond:[`Pace matters. Someone who wants to skip steps is signaling discomfort with the ordinary middle of things.`,`Watch for affection that tracks compliance — if warmth increases when you agree and cools when you don’t, that’s information.`,`The boring-good-day test: can this person be content when nothing dramatic is happening?`]
  },
  stone:{
    what:`Stonewalling as a pattern is not the same as needing a break. It is the repeated use of complete emotional withdrawal — going silent, leaving, refusing to engage — as a way to end or win disagreements rather than as a genuine dysregulation break.`,
    develops:`Gottman’s research identifies stonewalling as a physiological response to flooding (heart rate above ~100 bpm), but notes that chronic stonewallers often avoid the cue rather than repairing it. In attachment terms it maps to dismissive-avoidant style: connection is sought but intimacy triggers deactivating strategies.`,
    feels:`The receiving partner is left holding an unresolved issue with no path to resolution. Over time this creates a pattern where only one person can “lose” a conversation — by being the one who always has to reopen it, always has to manage the breach, always has to absorb the non-response.`,
    research:`Gottman and Levenson (1988) found stonewalling in 85% of cases to be performed by men in heterosexual couples, though this varies across populations. In their longitudinal data, chronic stonewalling was one of the “Four Horsemen” — the four behavioral predictors of divorce. The issue is not that it happens but that it becomes the primary conflict resolution strategy.`,
    respond:[`A genuine break with a time and return commitment is not stonewalling. Insist on that contract: “Let’s take 30 minutes and then finish this.”`,`Track whether the issues raised before a silence ever actually get resolved — or whether silence functions as the resolution.`,`Gottman’s self-soothing protocol (physiological calming before re-engagement) is evidence-based and worth introducing as a joint practice.`]
  },
  passive:{
    what:`Passive aggression as a relational pattern is the consistent indirect expression of hostility — through procrastination, forgetfulness, backhanded compliments, or cold compliance — rather than direct communication of grievance. It is a relationship to conflict, not a single behavior.`,
    develops:`Passive aggression typically develops in environments where direct expression of anger or dissatisfaction was unsafe or punished. The person learned to get needs met — or get even — without the risk of direct confrontation. In adulthood this becomes the default mode for handling relational friction.`,
    feels:`Partners describe the exhausting work of decoding. “Fine” means nothing is fine. Forgetting feels deliberate. The hostility is plausibly deniable at every step, which means raising it always looks like the more irrational move. You become the interpreter of a language you were never taught.`,
    research:`Wetzler (1992) identified passive aggression as a relational style distinct from isolated passive-aggressive acts, characterized by persistent ambiguity and deniability. Contemporary personality research connects it to low Agreeableness and indirect hostility as measured on the Dark Triad scales.`,
    respond:[`Name the pattern without diagnosing the person: “I’ve noticed that when you’re upset, I find out through behavior rather than words. I’d rather hear it directly.”`,`Invite direct expression repeatedly, especially after the behavior occurs: “What’s actually going on?”`,`Passive aggression often softens when direct expression becomes safe — i.e., when direct anger is met with curiosity rather than counterattack.`]
  },
  identity:{
    what:`Identity-based attacks use a partner’s background, ethnicity, religion, gender, neurodiversity, mental health history, or personal insecurities as ammunition during conflict. The attack is precise because it uses intimate knowledge — things only shared in trust — against the person who shared them.`,
    develops:`This pattern is often associated with contempt (Gottman’s strongest predictor of relationship breakdown) and with a relational style that competes for status within the partnership. The person who uses identity attacks has learned that hitting the most sensitive target ends the argument fastest.`,
    feels:`The violation is doubled: the trust that allowed disclosure is what makes the attack effective. Partners often describe starting to hide or pre-censor information about themselves to prevent future ammunition. The relationship becomes a place where being fully known feels dangerous.`,
    research:`Research on interpersonal rejection sensitivity (Downey & Feldman, 1996) shows that people with high rejection sensitivity are particularly vulnerable to identity-based attacks because the content maps directly onto the fears they brought into the relationship. The attack doesn’t land randomly — it lands precisely.`,
    respond:[`Name the specific content that was weaponized: “What you said about that topic used something I told you in confidence. That’s off-limits.”`,`Track whether apologies are followed by the same content reappearing in the next conflict.`,`A relationship in which you are systematically concealing parts of yourself to stay safe is already a relationship in which you have lost ground.`]
  },
  narcissistic:{
    what:`Narcissistic relational patterns involve the consistent centering of one person’s needs, perceptions, and narrative at the expense of the partner’s — manifesting as conversation hijacking, inability to hold accountability, entitlement, and the treatment of the partner’s perspective as a threat to be neutralized rather than a viewpoint to be engaged.`,
    develops:`Narcissistic personality organization (Kernberg’s term, distinct from the clinical diagnosis of NPD) typically develops from early environments that either failed to provide healthy mirroring or provided so much idealized mirroring that normal imperfection became intolerable. The grandiosity is a defense against a fragile core self rather than a stable identity.`,
    feels:`Partners describe the specific exhaustion of never being fully seen. Every conversation eventually becomes about them. Good news gets hijacked. Mistakes never quite land with ownership. You begin to shrink your own experience to avoid the work of competing for space in your own relationship.`,
    research:`Craig Malkin’s Rethinking Narcissism (2015) offers the most accessible research-grounded account, distinguishing healthy self-regard from the echoism (self-erasure) that frequently develops in partners of people with high narcissistic traits. His research shows narcissistic traits are more malleable than popular culture suggests — but only with sustained motivation on the person’s own part.`,
    respond:[`Watch the accountability test: can they say “I was wrong” about something real, without a “but” or a counter-grievance?`,`Your experience deserves the same airtime as theirs. Name this: “I’ve noticed that when I raise something, we usually end up on your feelings rather than the topic.”`,`The prognosis for change is better in people who voluntarily pursue individual therapy for this — not because a partner requires it.`]
  },
  financial:{
    what:`Financial abuse involves the use of money — access, control, information, or withholding — as an instrument of power in a relationship. This ranges from requiring permission to spend, to controlling all account access, to sabotaging a partner’s income or employment, to creating debt in their name.`,
    develops:`Financial control escalates alongside other coercive control patterns and is often one of the later-emerging elements — once other forms of dependency have been established. The Economic Abuse Reference Guide (Sharp-Jeffs, 2015) identifies three primary mechanisms: exploiting (using a partner’s resources), sabotaging (destroying income potential), and coercing (forcing financial decisions).`,
    feels:`The practical effect is a partner who cannot leave because they have no money — often the explicit design. Beyond exit blockage, financial dependence creates a daily power differential that touches every decision. Even small purchases become negotiation, permission, or risk.`,
    research:`The Allstate Foundation’s research (2009) found that 98% of domestic abuse survivors reported also experiencing economic abuse. More recently, the concept of “economic entrapment” has been formalized as a distinct harm category — recognizing that financial control can constitute abuse entirely independently of physical violence.`,
    respond:[`Your own income and your own accessible account are not luxuries — they are foundational to the ability to leave.`,`Know what accounts exist and what they contain. Opacity in this area is itself a signal.`,`Economic abuse specialists (distinct from general financial advisors) are available through most domestic violence organizations and can help create a safety plan.`]
  },
  intimidation:{
    what:`Intimidation as an abuse pattern uses physical size, positioning, proximity, facial expression, voice, or property destruction to create fear without necessarily making physical contact. The legal definition in many jurisdictions includes “putting someone in fear” — the intent to frighten, not just the act of violence.`,
    develops:`Intimidation is typically a learned behavior that has been successful — it ends disagreements, restores control, and triggers submission quickly. The escalation ladder often moves from posturing and raised voice, to property destruction, to physical contact. But property destruction and posturing are already abusive — they do not require escalation to count.`,
    feels:`The physiological fear response is real and it is correct: your nervous system is correctly identifying a threat. Partners frequently minimize this because “nothing happened” — but the purpose of intimidation is precisely to control through the threat, so that explicit violence is rarely necessary.`,
    research:`The Power and Control Wheel (Duluth Model, Pence & Paymar, 1993) identifies intimidation as one of eight primary tactics in a pattern of domestic abuse. Research shows that property destruction in particular is strongly predictive of future physical violence (Hotaling & Sugarman, 1986).`,
    respond:[`Fear in your own home is not normal. If you are afraid, that is sufficient. You do not need bruises to name it.`,`Property destruction during conflict is not “just venting” — it is a demonstration of what could happen to you.`,`Safety planning with a specialized advocate is the right step here, not couples work.`]
  },
  sexual:{
    what:`Sexual coercion in a relationship context includes pressure, guilt-tripping, persistence after a no, sulking or anger as a response to refusal, and the use of intimacy as a transactional reward or punishment. Consent within an established relationship is not automatic — it is required every time.`,
    develops:`Sexual coercion frequently develops alongside other entitlement patterns and escalates in parallel with emotional coercion. The relational script that drives it treats the partner as having an obligation (real or implied) rather than a choice. Research shows it is underreported partly because it doesn’t match cultural scripts of what “real” sexual violence looks like.`,
    feels:`Partners describe learning to say yes to avoid the aftermath — the sulking, the guilt, the withdrawal. When the cost of saying no consistently exceeds the cost of going along, consent is no longer meaningfully operating. This is coercion regardless of whether force is used.`,
    research:`DeKeseredy & Schwartz (2001) estimated that sexual coercion by intimate partners affects approximately 1 in 4 women in long-term relationships, making it the most statistically common form of sexual coercion. The SANE (Sexual Assault Nurse Examiner) framework now explicitly includes non-physical coercion in its assessment protocols.`,
    respond:[`A no should cost you nothing. If there is a predictable negative consequence for declining, that is coercion.`,`You are not obligated to accept any sexual act in exchange for relationship peace.`,`RAINN (1-800-656-4673) provides support specifically for coercion and pressure within relationships — not just stranger assault.`]
  },
  isolation:{
    what:`Isolation as a control tactic involves the systematic narrowing of a partner’s external connections — friends, family, colleagues, activities — in order to increase dependency, reduce outside perspective, and make exit more difficult. It often proceeds gradually and is presented as concern, preference, or wounded love.`,
    develops:`Isolation is among the most reliably documented tactics in coercive control relationships (Johnson, 2008; Stark, 2007). It proceeds in phases: complaints about specific people, then about the time spent with people, then about the idea of external connection itself. The effect is that the controlling partner becomes the only source of emotional support, validation, and social contact.`,
    feels:`Partners often realize the isolation in retrospect — mapping who is left in their lives and noticing that only people approved by the partner have survived. The world has contracted. And because the contraction was gradual, each step seemed explainable.`,
    research:`Judith Herman’s Trauma and Recovery (1992) identifies isolation as one of the primary methods of psychological coercion — parallel to what perpetrators of hostage situations and cult leaders deploy. The mechanism is identical: remove outside perspective, and the controller’s reality becomes the only available one.`,
    respond:[`Your outside connections are not a threat to a healthy relationship. If they consistently are treated as one, that is the data.`,`Rebuilding external ties is both prevention and recovery. Start small: one text, one coffee, one conversation outside the relationship.`,`An advocate at a domestic violence organization can help you map the isolation and plan safely — including how to re-establish contact with people who may feel distant.`]
  },
  blame:{
    what:`Blame-shifting and DARVO (Deny, Attack, Reverse Victim and Offender) is the pattern in which a person accused of harmful behavior responds by denying it, attacking the person who raised it, and repositioning themselves as the real victim of the accusation. The result is that the person who raised the concern ends up apologizing for raising it.`,
    develops:`DARVO was named and systematically described by Jennifer Freyd (1997) in the context of institutional responses to abuse allegations — but it operates identically in intimate relationships. It is a defensive maneuver that has been effective: it stops accountability conversations in their tracks and transfers the emotional debt to the person seeking accountability.`,
    feels:`Partners describe the disorienting experience of starting a conversation about a real concern and ending it by comforting the person who hurt them. After enough iterations, you stop raising things — which is exactly what the pattern achieves.`,
    research:`Harsey, Zurbriggen & Freyd (2017) found that DARVO is a common response to disclosures of sexual assault and emotional abuse, and that witnessing DARVO increases victim self-blame. The pattern is so reliably destabilizing precisely because it exploits the target’s care for the relationship.`,
    respond:[`Stay on the original topic: “I hear that you’re upset. I’d like to come back to what I raised.”`,`Track across conversations: who ends up apologizing for the raise, not just for the behavior?`,`If every concern you raise reverses onto you, the mechanism itself is the problem — independent of any individual issue.`]
  },
  somatic:{
    what:`Somatic manipulation involves the use of real or exaggerated physical symptoms — headaches, chest pain, panic, illness — to halt difficult conversations, avoid accountability, or generate guilt in the partner who raised an issue. This does not mean all illness is manipulation; it means that when illness predictably follows accountability attempts, a pattern exists.`,
    develops:`Somatic symptom patterns can begin as genuine distress responses — emotional pain expressed physically — and become instrumentalized over time when the partner learns that physical symptoms reliably redirect attention and end threatening conversations. The behavior is often not consciously strategic.`,
    feels:`Partners describe the impossible position of not being able to tell the real from the managed. You can’t push through what might be genuine pain. So accountability consistently yields to care, and the original issue disappears. You begin to feel guilty for raising things at all.`,
    research:`Research on illness behavior in relationship contexts (Barsky, 2002) distinguishes genuine somatization (physical expression of psychological distress, which is real and valid) from factitious behavior (conscious fabrication) from instrumentalized illness (real or exaggerated symptoms deployed functionally). The latter is the pattern relevant here.`,
    respond:[`The timing is the data. Note whether symptoms track conflict — not to dismiss them, but as a legitimate observation.`,`“Can we set a time to return to this when you’re feeling better?” — and then hold to it.`,`If this pattern is entrenched, a therapist for both individuals (separately) is more appropriate than couples counseling.`]
  },
  jealousy:{
    what:`Pathological jealousy is an unfounded, persistent belief that a partner is being or will be unfaithful, combined with surveillance, interrogation, or punishment in response to that belief — and crucially, a pattern in which no reassurance or evidence succeeds in calming the jealousy for long.`,
    develops:`Pathological jealousy is associated with insecure (particularly anxious) attachment, borderline personality features, and sometimes delusional thinking (Othello syndrome). It differs from normal jealousy in two key ways: it persists without evidence, and it is not resolved by reassurance. Each reassurance is temporary; the next incident resets the cycle.`,
    feels:`Partners describe the exhausting work of perpetual proof. Every interaction outside the relationship becomes a potential accusation. You self-censor, self-monitor, and self-report preemptively to manage the aftermath. Your freedom shrinks to fit the size of their anxiety.`,
    research:`Karakurt & Silver (2013) identify pathological jealousy as distinct from normative jealousy in intimate relationships, and associate it with higher rates of partner violence. The jealousy functions as a control tactic regardless of whether the jealous person experiences it as fear rather than aggression.`,
    respond:[`Your behavior should not have to fit the constraints of their jealousy. Accommodating surveillance is not reassurance — it is compliance.`,`Ask: what would actually help you feel secure — and is that question about me, or about something inside you?`,`Jealousy rooted in the person’s own history or attachment style is addressable in individual therapy, not by partner modification.`]
  },
  religious:{
    what:`Religious or cultural coercion uses shared (or claimed) faith, scripture, cultural expectation, or community norms to enforce compliance, restrict choices, and insulate control from challenge. The coercion is distinguished from genuine shared faith by its asymmetry: the rules bind the partner, while the controlling person selectively exempts themselves.`,
    develops:`Religious coercion exploits the specific vulnerability that comes from shared identity and community membership: challenging the control means potentially challenging the faith, the culture, and the community simultaneously. This makes resistance feel not just personally risky but existentially threatening.`,
    feels:`Partners describe the specific trap of having their own values weaponized against them. Dissent is framed as sin, faithlessness, or cultural betrayal. The community may be complicit, reducing outside support. The intimate and the institutional become fused.`,
    research:`Drumm, Popescu & Kersting (2009) documented the distinct dynamics of religious intimate partner abuse, noting that survivors face additional barriers including fear of community judgment and lack of support from religious institutions. The National Domestic Violence Hotline has specialized resources for survivors navigating faith-based abuse contexts.`,
    respond:[`Shared faith or culture should apply to both people with equal weight. Ask directly whether the obligations are mutual.`,`Genuine faith communities do not endorse domestic control. Many have trained advocates; the hotline can connect you to faith-sensitive resources.`,`Your tradition and your safety are not in conflict — even if someone has made them feel that way.`]
  },
  humiliation:{
    what:`Public humiliation, private shaming, and status-building at a partner’s expense are patterns of degradation — making the partner small to make the self look larger. This includes cutting remarks in social settings, sharing private information as entertainment, and the deployment of “just joking” as retroactive consent.`,
    develops:`Humiliation as a control tactic functions by eroding the partner’s self-concept and social standing — making exit feel less viable and making the relationship feel like the only place where any version of worth is available. It is associated with contempt and with sadistic interpersonal styles.`,
    feels:`Partners describe the double bind of social situations: the anticipation of the cutting remark, the performance of not-minding, the processing afterwards alone. The public witness adds a layer of shame — not just the hurt, but the not-being-defended, the watching-others-laugh.`,
    research:`Gottman’s contempt research (1994) identifies the eye-roll, the sneer, and the cutting public remark as markers of contempt — the single strongest predictor of relationship deterioration. Unlike criticism or defensiveness, contempt communicates fundamental disrespect for the partner’s humanity.`,
    respond:[`Name the specific incident: “What you said about me in front of those people was humiliating. I need that to stop.”`,`Private information shared as social currency is a violation of trust beyond the humiliation itself.`,`“Can’t you take a joke?” is not an explanation. If you are consistently hurt by the jokes, the jokes are not jokes.`]
  },
  rage:{
    what:`Explosive rage as a relational pattern — disproportionate outbursts followed by remorse, renewed warmth, and eventual re-escalation — is the cycle most people recognize from descriptions of the “cycle of abuse.” The post-explosion remorse and warmth phase (the honeymoon period) is as much a part of the pattern as the explosion itself.`,
    develops:`Walker’s cycle of violence (1979) remains the standard framework: tension building → explosion → honeymoon → tension building. The honeymoon phase creates the attachment that makes leaving feel like abandoning someone at their most reachable and remorseful. Neurologically, explosive anger is associated with reduced prefrontal inhibition of limbic response — but this can be treated.`,
    feels:`Partners describe the constant environmental scanning — reading mood, managing topics, adjusting tone — to prevent the next explosion. Life is organized around the unpredictability. The post-explosion tenderness is genuine, which is why leaving during it feels wrong. But the next tension-build has already started.`,
    research:`The predictive research on domestic homicide (Campbell et al., 2003) identifies explosive anger, access to weapons, and recent separation as the three strongest risk factors. The explosion-remorse cycle is not self-correcting without intervention — it typically shortens (less time between explosions) and escalates over time.`,
    respond:[`Fear in this context is appropriate and informative. You should not have to manage someone’s explosions.`,`Anger management programs specifically designed for intimate partner violence (not generic anger management) have an evidence base. The distinction matters.`,`If you are planning to leave, do so with a safety plan and support from a domestic violence advocate — this is a statistically elevated-risk transition.`]
  },
  gatekeeper:{
    what:`Using children as leverage — threatening custody during conflict, withholding access as punishment, undermining the co-parenting relationship, or positioning as the “good parent” to the children — is a distinct abuse tactic that often intensifies after separation rather than ending with the relationship.`,
    develops:`Gatekeeping as a control tactic typically escalates during the separation process, when other control mechanisms are being lost. It exploits the asymmetry of parental attachment and the legal complexity of custody — areas where the controlling person can inflict significant harm through legitimate-seeming mechanisms.`,
    feels:`The targeted parent describes a dual experience: concern for the children’s wellbeing and access, and the realization that their bond with their children is being used as the mechanism of control. Every difficult conversation carries the implicit or explicit threat.`,
    research:`Johnston & Kelly (2004) document that parental alienation and gatekeeping behaviors escalate significantly in high-conflict post-separation situations, and that children exposed to sustained alienation tactics suffer distinct psychological harm independent of their relationship with either parent.`,
    respond:[`Document everything — access agreements, communications, incidents — from the start.`,`A family law attorney familiar with coercive control and parental alienation is essential in contested custody situations.`,`Domestic violence organizations have specialists in post-separation coercive control; this is a distinct and recognized area of expertise.`]
  },
};

      { h:"What it actually requires", p:"Clinical gaslighting has three components that have to appear together. First, the distortion is sustained and systematic — not one instance of \"I don't remember it that way,\" but a pattern. Second, the person doing it has consistent explanations that make your perception the problem (\"you're too sensitive,\" \"you always exaggerate,\" \"you're imagining things\"). Third, the result is that the target begins to doubt their own memory and judgment — not just in the relationship, but in general." },

  {id:"P2-Q23", a:"religious",  sensitive:false, q:"Does your partner use religion, scripture, cultural tradition, or family honor to justify controlling your behavior or dismissing your concerns?",                          h:"Faith and culture are meaningful. This is about them being used as tools of control.",ans:[{t:"No, faith or culture is shared respectfully or not used at all",w:0},{t:"Occasionally referenced in ways that feel off but not a consistent pattern",w:1},{t:"Yes, religious or cultural framing is regularly used to justify their behavior or dismiss mine",w:2},{t:"Yes, consistently — I am told my concerns are sinful, shameful, or a violation of duty",w:3}]},
