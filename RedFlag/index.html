function ScenarioQuiz({ rel, onComplete }) {
  const [idx,        setIdx]        = useState(0);
  const [answers,    setAns]        = useState([]);
  const [myChoice,   setMyChoice]   = useState(null);
  const [theirChoice,setTheirChoice]= useState(null);
  const [freq,       setFreq]       = useState(null);
  const s = SCENARIOS[idx];
  const total = SCENARIOS.length;
  const isSelf = rel === "self";
  function next() {
    if (myChoice===null||theirChoice===null||freq===null) return;
    const na = [...answers, { scenarioId:s.id, myChoice, theirChoice, frequency:freq }];
    setAns(na); setMyChoice(null); setTheirChoice(null); setFreq(null);
    if (idx+1>=total) onComplete(na); else setIdx(idx+1);
  }
  const ready = myChoice!==null && theirChoice!==null && freq!==null;
  return (<div className="container quiz view">
    <div className="progress"><i style={{ width:Math.round((idx/total)*100)+"%" }}/></div>
    <div className="quiz-meta"><span>Scenario {idx+1} of {total}</span></div>
    <div className="scenario-block">
      <div className="scenario-label">{s.title}</div>
      <p style={{ color:"var(--ink-dim)", fontSize:15, lineHeight:1.75, margin:0 }}>{reframe(s.story, rel)}</p>
    </div>
    <div className="sec-h" style={{ margin:"20px 0 10px" }}>Your gut reaction —</div>
    {s.reactions.map((r,i)=>(<button key={i} className={"opt"+(myChoice===i?" sel":"")} onClick={()=>setMyChoice(i)}>{reframe(r.t, rel, false)}</button>))}
    {myChoice!==null && (<>
      <div className="sec-h" style={{ margin:"22px 0 10px" }}>{isSelf?"Your partner's likely reaction —":"Their gut reaction —"}</div>
      {s.reactions.map((r,i)=>(<button key={i} className={"opt partner-opt"+(theirChoice===i?" sel":"")} onClick={()=>setTheirChoice(i)}>{reframe(r.t, rel, false)}</button>))}
    </>)}
    {myChoice!==null && theirChoice!==null && (<>
      <div className="sec-h" style={{ margin:"22px 0 10px" }}>How often does this play out?</div>
      <div className="freq-row">
        {[{l:"Rarely",v:1},{l:"Sometimes",v:2},{l:"Often",v:3}].map(({l,v})=>(<button key={v} className={"freq-opt"+(freq===v?" sel":"")} onClick={()=>setFreq(v)}><span className="freq-l">{l}</span></button>))}
      </div>
    </>)}
    <button className="btn btn-solid btn-block mt" disabled={!ready} onClick={next}>{idx+1<total?"Next":"See results"}</button>
  </div>);
}

function DualResults({ dualResult, onWhatNow, onReport, onRestart }) {
  const { partnerScores, userScores, flaggedPartner, primary:pk, secondary:sk, combinedLabel, severity } = dualResult;
  const partnerKeys = Object.keys(partnerScores).sort((a,b)=>(partnerScores[b]||0)-(partnerScores[a]||0));
  const userFlagged = Object.keys(userScores).filter(k=>(userScores[k]||0)>=4).sort((a,b)=>(userScores[b]||0)-(userScores[a]||0));
  return (<div className="container view">
    <div className="eyebrow">Your results</div>
    <h1 style={{ fontSize:34, fontWeight:400, marginBottom:12 }}>Here's what your answers reveal.</h1>
    <div className="notice">RedFlag identifies patterns in behavior, not clinical conditions. Results are for self-reflection only.</div>
    {pk && (<div className="combined">
      <div className="l">{severity.display}</div>
      <div style={{ fontFamily:"var(--display)", fontSize:18, lineHeight:1.3 }}>{ARC[pk]?.street}</div>
      {combinedLabel && <div style={{ fontSize:13, color:"var(--ink-dim)", marginTop:4 }}>Combined with {ARC[sk]?.street}: &ldquo;{combinedLabel}&rdquo;</div>}
    </div>)}
    <div className="results">
      <div>
        <h3 className="sec-h">Their patterns</h3>
        {partnerKeys.map(k=>{ const sev=getSev(partnerScores[k]||0,k); const fl=(partnerScores[k]||0)>=4; return (
          <div key={k} className="card" style={{ marginBottom:10, opacity:fl?1:.5 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:10 }}>
              <div style={{ fontFamily:"var(--display)", fontWeight:500 }}>{ARC[k]?.street}</div>
              <div style={{ fontFamily:"var(--mono)", fontSize:11, padding:"2px 9px", borderRadius:20, background:fl?"var(--accent-glow)":"var(--bg-2)", color:fl?"var(--accent-bright)":"var(--ink-faint)", whiteSpace:"nowrap" }}>{sev.display}</div>
            </div>
          </div>); })}
        {userFlagged.length>0 && (<>
          <div className="divider"/>
          <h3 className="sec-h">Your own patterns (in this dynamic)</h3>
          {userFlagged.map(k=>(<div key={k} className="card" style={{ marginBottom:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", gap:10 }}>
              <div style={{ fontFamily:"var(--display)", fontWeight:500 }}>{ARC[k]?.street}</div>
              <div style={{ fontFamily:"var(--mono)", fontSize:11, padding:"2px 9px", borderRadius:20, background:"var(--bg-2)", color:"var(--ink-faint)", whiteSpace:"nowrap" }}>score {userScores[k]}</div>
            </div>
          </div>))}
        </>)}
      </div>
      <aside className="side">
        <div className="side-card">
          <div className="sec-h" style={{ marginBottom:10 }}>Next steps</div>
          <div className="actions">
            <button className="btn btn-solid" onClick={onWhatNow}>What do I do now?</button>
            <button className="btn btn-outline" onClick={onReport}>Download printable report</button>
            <button className="btn btn-outline" onClick={onRestart}>Start over</button>
          </div>
        </div>
      </aside>
    </div>
  </div>);
}

function WhatNow({ dualResult, onReport, onFinder, onRestart }) {
  const [tab, setTab] = useState(0);
  const { flaggedPartner, partnerScores } = dualResult || { flaggedPartner:[], partnerScores:{} };
  const tabs = ["Your patterns","Scripts","Can it change?","Red vs green","Get help"];
  const scripts = SCRIPTS[flaggedPartner[0]] || DEFAULT_SCRIPTS;
  return (<div className="container narrow view">
    <div className="eyebrow">What now</div>
    <h1 style={{ fontSize:34, fontWeight:400, marginBottom:12 }}>Here's where to go from here.</h1>
    <div className="notice">RedFlag identifies patterns in behavior, not clinical conditions. Results are for self-reflection only, not professional mental health advice.</div>
    <div className="tabs">{tabs.map((t,i)=>(<button key={i} className={"tab"+(tab===i?" active":"")} onClick={()=>setTab(i)}>{t}</button>))}</div>
    {tab===0 && (<div>
      <h3 className="sec-h">Patterns you flagged</h3>
      {flaggedPartner.length===0
        ? <p style={{ color:"var(--ink-dim)" }}>You didn't cross the red-flag line across the scenarios. That's a real result — worth trusting, not explaining away.</p>
        : <div className="grid grid-2">{flaggedPartner.map(k=>{ const P=PLAY[k]||{}; return (
            <div key={k} className="card">
              <div className="arc-name">{ARC[k].street}</div>
              <div className="arc-clin" style={{ marginBottom:8 }}>{ARC[k].clinical}</div>
              <p className="arc-desc" style={{ marginBottom:10 }}>{ARC_DESC[k]}</p>
              {P.watch && <><div className="sec-h" style={{ marginBottom:6 }}>What it looks like</div>{P.watch.map((w,wi)=><p key={wi} className="hang">{w}</p>)}</>}
              {P.ask && <><div className="sec-h" style={{ margin:"8px 0 6px" }}>What to ask or watch for</div>{P.ask.map((w,wi)=><p key={wi} className="hang" style={{ borderColor:"var(--accent)" }}>{w}</p>)}</>}
            </div>); })}</div>}
    </div>)}
    {tab===1 && (<div><h3 className="sec-h">Scripts to start with</h3><p style={{ color:"var(--ink-dim)", fontSize:14, marginBottom:12 }}>Starting points, not lines to memorize. Adapt to your voice.</p>{scripts.map((s,si)=><div key={si} style={{ background:"var(--bg-2)", borderRadius:9, padding:"13px 16px", marginBottom:10, fontFamily:"var(--display)", fontStyle:"italic", fontSize:15, lineHeight:1.7, color:"var(--ink-dim)" }}>{s}</div>)}</div>)}
    {tab===2 && (<div>
      <h3 className="sec-h">Can this change?</h3>
      <p style={{ color:"var(--ink-dim)", marginBottom:14 }}>Short version: change is possible, but it has to be theirs. You can set the conditions and hold the boundary — you can't do the changing for them. Watch behavior over months, not promises over dinner.</p>
      {flaggedPartner.length===0
        ? <p style={{ color:"var(--ink-dim)" }}>Nothing crossed the line, so there's nothing to "fix." Keep noticing patterns over time.</p>
        : <div className="grid grid-2">{flaggedPartner.map(k=>{ const P=PLAY[k]||{change:{real:[],fake:[]}}; return (
            <div key={k} className="card">
              <div className="arc-name" style={{ marginBottom:8 }}>{ARC[k].street}</div>
              {P.safety && <div className="notice danger" style={{ marginBottom:10 }}>This pattern can involve real danger. It is <strong>not</strong> a fix-it-from-the-inside project. Change, if it comes, needs professional help — and your safety comes first.</div>}
              <div className="sec-h" style={{ color:"var(--green)", marginBottom:6 }}>Signs of real change</div>
              {(P.change?.real||[]).map((s,si)=><p key={si} className="hang" style={{ borderColor:"var(--green)" }}>{s}</p>)}
              <div className="sec-h" style={{ color:"var(--accent-bright)", margin:"8px 0 6px" }}>Signs of fake change</div>
              {(P.change?.fake||[]).map((s,si)=><p key={si} className="hang" style={{ borderColor:"var(--accent)" }}>{s}</p>)}
            </div>); })}</div>}
      {flaggedPartner.length>0 && <p style={{ color:"var(--ink-dim)", fontSize:14, marginTop:12 }}>If the fake-change signs keep repeating, believe the pattern — not the apology.</p>}
    </div>)}
    {tab===3 && (<div>
      <h3 className="sec-h" style={{ color:"var(--green)" }}>Signs this can be worked on</h3>
      {["They acknowledge impact without defending intent.","They stay in hard conversations rather than shutting down.","They can say 'I was wrong' without making you feel guilty.","They celebrate your wins without redirecting to themselves."].map((g,gi)=><p key={gi} className="hang" style={{ borderColor:"var(--green)" }}>{g}</p>)}
      <h3 className="sec-h" style={{ marginTop:18, color:"var(--accent-bright)" }}>Signs this may be more serious</h3>
      {["Conversations consistently end with you apologizing.","Your emotional responses are treated as weapons.","You feel less like yourself than before this relationship.","Raising issues feels more dangerous than staying silent."].map((r,ri)=><p key={ri} className="hang" style={{ borderColor:"var(--accent)" }}>{r}</p>)}
    </div>)}
    {tab===4 && (<div>
      <h3 className="sec-h">You don't have to figure this out alone</h3>
      <p style={{ color:"var(--ink-dim)", marginBottom:12 }}>Therapy is not about being broken. It's about having a dedicated space to think clearly about something hard to see from the inside.</p>
      <div className="card" style={{ marginBottom:12 }}><div style={{ fontWeight:600 }}>National Domestic Violence Hotline</div><div style={{ fontFamily:"var(--mono)", fontSize:22, fontWeight:700, color:"var(--accent-bright)" }}>1-800-799-7233</div><div style={{ fontSize:12, color:"var(--ink-faint)" }}>24/7 · Free · Confidential · Text START to 88788</div></div>
      <div className="card"><div style={{ fontWeight:600 }}>Crisis Text Line</div><div style={{ fontSize:15, color:"var(--ink-dim)" }}>Text HOME to 741741</div><div style={{ fontSize:12, color:"var(--ink-faint)" }}>Free · Confidential · 24/7</div></div>
    </div>)}
    <div className="divider"/>
    <div className="actions">
      {onReport && <button className="btn btn-outline" onClick={onReport}>Download printable report</button>}
      {onFinder && <button className="btn btn-outline" onClick={onFinder}>Open the Warning-Sign Finder</button>}
      <button className="btn btn-outline" onClick={onRestart}>Start over</button>
    </div>
  </div>);
}

// ─── WARNING-SIGN FINDER ──────────────────────────────────────────────────────────
function FinderList({ heading, items, accent, quote }) {
  return (<div className="card">
    <h3 className="sec-h" style={{ color:accent||"var(--ink-dim)", marginBottom:10 }}>{heading}</h3>
    {items.map((t,i)=>(<div key={i} className="list-item">
      <div className="dot" style={{ background:accent||"var(--ink-faint)" }}/>
      <div style={{ fontSize:14, lineHeight:1.6, color:"var(--ink-dim)", fontStyle:quote?"italic":"normal" }}>{t}</div>
    </div>))}
  </div>);
}
function FinderScreen({ onQuiz }) {
  const [phase, setPhase] = useState("dates");
  const d = FINDER[phase]; const phases = Object.keys(FINDER);
  return (<div className="container view">
    <div className="eyebrow">Warning-Sign Finder</div>
    <h1 style={{ fontSize:"clamp(30px,4vw,44px)", fontWeight:400, marginBottom:12 }}>Map someone before you're in deep.</h1>
    <p className="sub" style={{ maxWidth:"68ch" }}>Pick where you are. You get questions worth asking, the green flags that mean “keep going,” the warning signs worth slowing down for, and boundary lines to say out loud.</p>
    <div className="pills">{phases.map(k=>(<button key={k} className={"pill" + (phase===k?" active":"")} aria-pressed={phase===k} onClick={()=>setPhase(k)}>{FINDER[k].label}</button>))}</div>
    <div className="notice">{d.intro}</div>
    <div className="grid grid-2" style={{ marginTop:16 }}>
      <FinderList heading="Questions worth asking" items={d.ask} accent="var(--ink)" quote/>
      <FinderList heading="Green flags — keep going" items={d.green} accent="var(--green)"/>
      <FinderList heading="Warning signs — slow down" items={d.red} accent="var(--accent-bright)"/>
      <FinderList heading="Boundary lines to say out loud" items={d.boundary} accent="var(--ink-dim)" quote/>
    </div>
    <div className="divider"/>
    <button className="btn btn-primary" onClick={onQuiz}>Run the full pattern quiz →</button>
    <p style={{ fontFamily:"var(--mono)", fontSize:11.5, color:"var(--ink-faint)", marginTop:12 }}>The Finder is a screening tool, not a diagnosis. Trust patterns over single moments.</p>
  </div>);
}

// ─── PRINTABLE REPORT ────────────────────────────────────────────────────────────
const REL_WHO = { current:"your current partner", ex:"your ex-partner", new:"someone new", self:"yourself" };
function sevMeta(label) {
  return ({ severe:{code:"//// SEVERE",cls:"rf-sev-severe"}, address:{code:"/// WORTH ADDRESSING",cls:"rf-sev-address"}, watch:{code:"// WORTH WATCHING",cls:"rf-sev-watch"}, healthy:{code:"·  CLEAR",cls:"rf-sev-healthy"} })[label] || { code:"·  CLEAR", cls:"rf-sev-healthy" };
}
function ReportScreen({ rel, dualResult, scenarioAnswers, onBack }) {
  const { partnerScores, flaggedPartner, primary:pk, secondary:sk, combinedLabel } = dualResult || { partnerScores:{}, flaggedPartner:[], primary:null, secondary:null, combinedLabel:null };
  const overall = pk ? getSev(partnerScores[pk]||0, pk) : { label:"healthy", display:"No red flags" };
  const isSelf = rel === "self";
  const dateStr = new Date().toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" });
  const allKeys = Object.keys(partnerScores).sort((a,b)=>(partnerScores[b]||0)-(partnerScores[a]||0));
  function auditFor(k) {
    const contribs = (scenarioAnswers||[]).filter(a=>{
      const sc=SCENARIOS.find(s=>s.id===a.scenarioId); if(!sc) return false;
      const r=sc.reactions[a.theirChoice]; return r?.a===k && r.w>0;
    }).map(a=>{
      const sc=SCENARIOS.find(s=>s.id===a.scenarioId);
      const r=sc.reactions[a.theirChoice]; const freq=a.frequency||1;
      return { scenario:sc.title, choice:r.t, w:r.w, freq, freqL:["","Rarely","Sometimes","Often"][freq], pts:r.w*freq };
    }).sort((x,y)=>y.pts-x.pts);
    const score=partnerScores[k]||0;
    const maxPossible=contribs.reduce((s,c)=>s+3*c.freq,0)||9;
    const sev=getSev(score,k);
    const crossed=(k==="isolation"||k==="blame")?5:sev.label==="severe"?9:sev.label==="address"?7:4;
    return { contribs, score, maxPossible, sev, crossed };
  }
  return (<div className="container view">
    <button className="btn btn-ghost rf-noprint" onClick={onBack}>← Back to results</button>
    <div className="rf-report rf-paper" style={{ marginTop:12 }}>
      <div className="rf-doc-title">RedFlag — Relational Risk Report</div>
      <div className="rf-doc-sub">A behavioral-pattern assessment of {REL_WHO[rel]||"this relationship"}.</div>
      <div className="rf-doc-meta">Generated {dateStr} · Reflects your perception, not a clinical diagnosis · Stays on your device</div>
      <hr className="rf-rule"/>
      <div className="rf-legend"><span><span className="rf-code">////</span> Severe</span><span><span className="rf-code">///</span> Worth addressing</span><span><span className="rf-code">//</span> Worth watching</span><span><span className="rf-code">·</span> Clear</span></div>
      <div className={"rf-summary " + sevMeta(overall.label).cls}>
        <div className="rf-code">{sevMeta(overall.label).code}</div>
        {pk ? (<p style={{ margin:"6px 0 0", fontSize:13 }}>Strongest pattern detected: <strong>{ARC[pk].street}</strong> ({ARC[pk].clinical}).{combinedLabel && <> Combined with {ARC[sk].street}: <strong>&ldquo;{combinedLabel}&rdquo;</strong>.</>}</p>)
             : (<p style={{ margin:"6px 0 0", fontSize:13 }}>No pattern crossed the red-flag threshold. That is a genuinely good result worth recognizing.</p>)}
      </div>
      <h2 className="rf-sec">Patterns assessed</h2>
      {allKeys.map(k=>{ const m=sevMeta(getSev(partnerScores[k]||0,k).label); return (
        <div key={k} style={{ display:"flex", gap:10, alignItems:"baseline", padding:"4px 0", borderTop:"0.5px solid #ccc", fontSize:12 }}>
          <span className="rf-code" style={{ flex:"0 0 118px" }}>{m.code}</span><span style={{ flex:1 }}>{ARC[k].street}</span><span className="rf-w" style={{ color:"#333" }}>score {partnerScores[k]||0}</span>
        </div>); })}
      {flaggedPartner.length>0 && (<><h2 className="rf-sec">Flagged patterns — detail &amp; audit trail</h2>
      {flaggedPartner.map(k=>{ const a=auditFor(k); const m=sevMeta(a.sev.label); return (
        <div key={k} className={"rf-block " + m.cls}>
          <div className="rf-block-name">{ARC[k].street}</div>
          <div className="rf-block-clin">{ARC[k].clinical} · <span className="rf-code">{m.code}</span></div>
          <p className="rf-block-desc">{ARC_DESC[k]}</p>
          <div className="rf-audit">
            <div className="rf-audit-h">Why this Relational Red Flag triggered</div>
            <p>Across {a.contribs.length} scenario{a.contribs.length===1?"":"s"} touching this pattern, scores summed to <span className="rf-formula">{a.score} of {a.maxPossible}</span> possible points.</p>
            <p className="rf-formula">score {a.score} ≥ {a.crossed} → {a.sev.display}</p>
            {a.contribs.length>0 && (<><p style={{ marginBottom:2, fontWeight:700, fontSize:11 }}>Heaviest contributors first:</p>
              <ul className="rf-contribs">{a.contribs.map((c,ci)=>(<li key={ci}><span className="rf-w">[{c.pts}/{3*c.freq}]</span><span>&ldquo;{c.choice}&rdquo; — {c.scenario} ({c.freqL})</span></li>))}</ul></>)}
          </div>
        </div>); })}</>)}
      {pk && sk && (<div className="rf-clash">
        <div className="rf-audit-h">Why you clash{combinedLabel?" — "+combinedLabel:""}</div>
        <p style={{ fontSize:12, margin:"0 0 6px" }}>Two strongest active patterns:</p>
        <ul className="rf-contribs">
          <li><span className="rf-w">{partnerScores[pk]||0}</span><span>{ARC[pk].street} — {getSev(partnerScores[pk]||0,pk).display}</span></li>
          <li><span className="rf-w">{partnerScores[sk]||0}</span><span>{ARC[sk].street} — {getSev(partnerScores[sk]||0,sk).display}</span></li>
        </ul>
        <p style={{ fontSize:12, margin:"8px 0 0" }}>{combinedLabel ? `${ARC[pk].street} landing on top of ${ARC[sk].street} is the named collision "${combinedLabel}". Each makes the other harder to interrupt.` : `${ARC[pk].street} and ${ARC[sk].street} are both active at once. They compound — addressing only one tends to leave the loop intact.`}</p>
      </div>)}
      <div className="rf-crisis"><div style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:".07em", marginBottom:4 }}>If you ever feel unsafe</div><div><strong>1-800-799-7233</strong> — National Domestic Violence Hotline (24/7, free, confidential)</div><div style={{ fontSize:12, marginTop:2 }}>Text START to 88788 · Crisis Text Line: text HOME to 741741</div></div>
      <hr className="rf-rule"/>
      <div className="rf-foot">RedFlag identifies patterns in behavior, not clinical conditions. This report reflects {isSelf?"your self-assessment":"your perception of another person"} and is for self-reflection only — not professional mental-health, legal, or diagnostic advice.</div>
    </div>
    <div className="rf-noprint actions" style={{ marginTop:18 }}>
      <button className="btn btn-solid" onClick={()=>window.print()}>Save as PDF</button>
      <button className="btn btn-outline" onClick={onBack}>← Back to results</button>
    </div>
    <p className="rf-noprint" style={{ fontFamily:"var(--mono)", fontSize:11.5, color:"var(--ink-faint)", marginTop:10 }}>Opens your browser's print dialog — choose &ldquo;Save as PDF&rdquo; to keep a copy. Ink-saver: black on white.</p>
  </div>);
}

// ─── APP ─────────────────────────────────────────────────────────────────────────
const VIEWS = { HOME:"home", LEARN:"learn", ARCHETYPES:"archetypes", PATTERNS:"patterns", LENSES:"lenses", FINDER:"finder", HELP:"help", BLOG:"blog", ABOUT:"about", QUIZ:"quiz" };
const SCREENS = { ONBOARD:"onboard", SCENARIO:"scenario", RESULTS:"results", WN:"wn", REPORT:"report" };

function App() {
  const saved = useMemo(loadSession, []);
  const [view,       setView]       = useState(()=>saved?.view       ?? VIEWS.HOME);
  const [screen,     setScreen]     = useState(()=>saved?.screen     ?? SCREENS.ONBOARD);
  const [rel,        setRel]        = useState(()=>saved?.rel        ?? null);
  const [scenarios,  setScenarios]  = useState(()=>saved?.scenarios  ?? []);
  const [dualResult, setDualResult] = useState(()=>saved?.dualResult ?? null);
  const theme = useThemeState();

  useEffect(()=>{ saveSession({ view, screen, rel, scenarios, dualResult }); },
    [view, screen, rel, scenarios, dualResult]);

  function top() { try { window.scrollTo(0,0); } catch (e) {} }
  function goView(v) { setView(v); top(); }
  function go(s) { setScreen(s); setView(VIEWS.QUIZ); top(); }
  function restart() { clearSession(); setView(VIEWS.QUIZ); setScreen(SCREENS.ONBOARD); setRel(null); setScenarios([]); setDualResult(null); top(); }
  function onNav(id) {
    if (id==="quiz") { setView(VIEWS.QUIZ); if(!rel) setScreen(SCREENS.ONBOARD); top(); }
    else goView(id);
  }

  return (
    <ThemeCtx.Provider value={theme}>
      <div className="rf-app">
        <Header onNav={onNav} active={view}/>
        <main className="rf-main">
          {view===VIEWS.HOME       && <Home onNav={onNav}/>}
          {view===VIEWS.LEARN      && <StartHere onNav={onNav}/>}
          {view===VIEWS.ARCHETYPES && <ArchetypesView onNav={onNav}/>}
          {view===VIEWS.PATTERNS   && <Patterns onNav={onNav}/>}
          {view===VIEWS.LENSES     && <Lenses onNav={onNav}/>}
          {view===VIEWS.HELP       && <GetHelp/>}
          {view===VIEWS.FINDER     && <FinderScreen onQuiz={()=>onNav("quiz")}/>}
          {view===VIEWS.BLOG       && <BlogView/>}
          {view===VIEWS.ABOUT      && <AboutView onNav={onNav}/>}
          {view===VIEWS.QUIZ && (<>
            {screen===SCREENS.ONBOARD  && <Onboarding onSelect={(r)=>{ setRel(r); go(SCREENS.SCENARIO); }}/>}
            {screen===SCREENS.SCENARIO && <ScenarioQuiz rel={rel} onComplete={(ans)=>{ const dr=computeDualResult(ans); setScenarios(ans); setDualResult(dr); go(SCREENS.RESULTS); }}/>}
            {screen===SCREENS.RESULTS  && dualResult && <DualResults dualResult={dualResult} onWhatNow={()=>go(SCREENS.WN)} onReport={()=>go(SCREENS.REPORT)} onRestart={restart}/>}
            {screen===SCREENS.WN       && dualResult && <WhatNow dualResult={dualResult} onReport={()=>go(SCREENS.REPORT)} onFinder={()=>onNav("finder")} onRestart={restart}/>}
            {screen===SCREENS.REPORT   && dualResult && <ReportScreen rel={rel} dualResult={dualResult} scenarioAnswers={scenarios} onBack={()=>go(SCREENS.WN)}/>}
          </>)}
        </main>
        <Footer onNav={onNav}/>
      </div>
    </ThemeCtx.Provider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));

</script>
</body>
</html>
