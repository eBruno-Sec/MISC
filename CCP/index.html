// ── APP STATE ─────────────────────────────────────────────────────────────────
let S={
  screen:'dashboard',// dashboard|setup|quiz|results
  mode:'easy',
  examType:'custom',
  domains:[],
  difficulty:[],
  count:20,
  missedOnly:false,
  markedOnly:false,
  weakOnly:false,
  shuffleChoices:true,
  questions:[],
  idx:0,
  answers:{},// qid -> {selected, marked, revealed}
  results:null,
  timer:null,
  timerSecs:null,
  timerInterval:null,
};
const DOMAIN_NAMES={1:'CMMC Ecosystem',2:'Ethics',3:'Governance',4:'Model Construct & Evaluation',5:'CAP / Assessment Process',6:'Scoping'};
const DOMAIN_WEIGHTS={1:.05,2:.05,3:.15,4:.35,5:.25,6:.15};

// ── QUESTION SAMPLING ─────────────────────────────────────────────────────────
function sampleQuestions(){
  const all=getAllQuestions();
  const stats=getStats();
  let pool=all.filter(q=>q!=null);

  if(S.domains.length>0) pool=pool.filter(q=>S.domains.includes(q.domain));
  if(S.difficulty.length>0) pool=pool.filter(q=>S.difficulty.includes(q.difficulty));

  if(S.missedOnly){
    const missed=new Set(stats.missedIds||[]);
    pool=pool.filter(q=>missed.has(q.id));
    if(!pool.length) return{error:'No missed questions yet. Take a quiz first.'};
  }
  if(S.markedOnly){
    const marked=new Set(stats.markedIds||[]);
    pool=pool.filter(q=>marked.has(q.id));
    if(!pool.length) return{error:'No marked questions yet. Mark some during a quiz first.'};
  }
  if(S.weakOnly){
    const ds=stats.domainStats||{};
    const ranked=Object.entries(ds).filter(([,v])=>v.total>=3).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total).slice(0,2).map(([k])=>Number(k));
    if(ranked.length>0) pool=pool.filter(q=>ranked.includes(q.domain));
  }

  if(!pool.length) return{error:'No questions match your filters.'};

  let target=S.examType==='full'?170:Math.min(S.count,pool.length);
  target=Math.min(target,pool.length);

  let selected;
  if(S.examType==='full'||S.domains.length===0){
    // Domain-weighted sampling
    const byDomain={};
    for(const q of pool)(byDomain[q.domain]||(byDomain[q.domain]=[])).push(q);
    const buckets=Object.keys(byDomain).map(Number);
    const out=[];
    for(const d of buckets){
      const w=DOMAIN_WEIGHTS[d]||0;
      const want=Math.round(target*w);
      const available=byDomain[d];
      const chosen=seededShuffle(available,Date.now()+d).slice(0,want);
      out.push(...chosen);
    }
    if(out.length<target){
      const extra=seededShuffle(pool.filter(q=>!out.some(o=>o.id===q.id)),Date.now()).slice(0,target-out.length);
      out.push(...extra);
    }
    selected=seededShuffle(out,Date.now()).slice(0,target);
  }else{
    selected=seededShuffle(pool,Date.now()).slice(0,target);
  }

  // Shuffle choices per-question if enabled
  if(S.shuffleChoices){
    selected=selected.map(q=>({...q,choices:seededShuffle(q.choices,q.id+Date.now())}));
  }
  return{questions:selected};
}

// ── SCORING ────────────────────────────────────────────────────────────────────
function computeResults(){
  const qs=S.questions;
  const ans=S.answers;
  let correct=0,unanswered=0;
  const missed=[],marked=[],traps=[];
  const domainMap={},typeMap={};

  for(const q of qs){
    const a=ans[q.id]||{};
    const isCorrect=a.selected&&q.choices.find(c=>c.id===a.selected)?.correct;
    if(!a.selected) unanswered++;
    if(isCorrect) correct++;
    else missed.push(q.id);
    if(a.marked) marked.push(q.id);
    if(q.type==='trap'&&!isCorrect) traps.push(q.id);

    const dk=String(q.domain);
    if(!domainMap[dk]) domainMap[dk]={total:0,correct:0};
    domainMap[dk].total++;
    if(isCorrect) domainMap[dk].correct++;

    const tk=q.type;
    if(!typeMap[tk]) typeMap[tk]={total:0,correct:0};
    typeMap[tk].total++;
    if(isCorrect) typeMap[tk].correct++;
  }

  const scorePercent=qs.length?Math.round((correct/qs.length)*1000)/10:0;
  const passEstimate=scorePercent>=75;
  return{total:qs.length,correct,unanswered,scorePercent,passEstimate,missed,marked,traps,domainMap,typeMap};
}

function persistStats(results){
  const stats=getStats();
  stats.totalAttempts=(stats.totalAttempts||0)+1;
  stats.totalSeen=(stats.totalSeen||0)+results.total;
  stats.totalCorrect=(stats.totalCorrect||0)+results.correct;
  stats.lastScore=results.scorePercent;
  stats.lastAt=new Date().toISOString();

  const ds=stats.domainStats||{};
  for(const[k,v]of Object.entries(results.domainMap)){
    if(!ds[k]) ds[k]={total:0,correct:0};
    ds[k].total+=v.total; ds[k].correct+=v.correct;
  }
  stats.domainStats=ds;

  const ts=stats.typeStats||{};
  for(const[k,v]of Object.entries(results.typeMap)){
    if(!ts[k]) ts[k]={total:0,correct:0};
    ts[k].total+=v.total; ts[k].correct+=v.correct;
  }
  stats.typeStats=ts;

  // Accumulate missed/marked
  const missedSet=new Set([...(stats.missedIds||[]),...results.missed]);
  // Remove questions answered correctly from missed set
  for(const q of S.questions){
    const a=S.answers[q.id]||{};
    if(a.selected&&q.choices.find(c=>c.id===a.selected)?.correct) missedSet.delete(q.id);
  }
  stats.missedIds=[...missedSet].slice(-1000);

  const markedSet=new Set([...(stats.markedIds||[]),...results.marked]);
  stats.markedIds=[...markedSet].slice(-500);

  saveStats(stats);
}

function render(){

}

function goHome(){clearInterval(S.timerInterval);S.screen='dashboard';render();}

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function renderDashboard(root){
  const stats=getStats();
  const qs=getAllQuestions();
  const readiness=stats.totalSeen>0?Math.round((stats.totalCorrect/stats.totalSeen)*1000)/10:null;

  const byDomain={};
  for(const q of qs)(byDomain[q.domain]||(byDomain[q.domain]=[])).push(q);

  const domainRows=Object.entries(byDomain).sort((a,b)=>a[0]-b[0]).map(([d,arr])=>{
    const acc=stats.domainStats?.[d];
    const accStr=acc&&acc.total>=1?`${Math.round((acc.correct/acc.total)*1000)/10}%`:'—';
    return`<tr><td>D${d}. ${DOMAIN_NAMES[d]||''}</td><td>${arr.length}</td><td>${accStr}</td></tr>`;
  }).join('');

  const ds=stats.domainStats||{};
  const weakest=Object.entries(ds).filter(([,v])=>v.total>=3).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total).slice(0,3);
  const weakPills=weakest.map(([d,v])=>`<span class="pill warn">D${d}: ${Math.round((v.correct/v.total)*1000)/10}%</span>`).join(' ');

  const ts=stats.typeStats||{};
  const weakTypes=Object.entries(ts).filter(([,v])=>v.total>=3).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total).slice(0,3);
  const typePills=weakTypes.map(([t,v])=>`<span class="pill warn">${t.replace(/_/g,' ')}: ${Math.round((v.correct/v.total)*1000)/10}%</span>`).join(' ');

  root.innerHTML=`
    <h1>CCP Readiness Dashboard</h1>
    <p class="sub">Track your CMMC Certified Professional exam readiness across all six domains.</p>
    <div class="grid2">
      <div class="stat"><div class="lbl">Question bank</div><div class="val">${qs.length}</div></div>
      <div class="stat"><div class="lbl">Readiness score</div><div class="val">${readiness!=null?readiness+'%':'—'}</div></div>
      <div class="stat"><div class="lbl">Last quiz score</div><div class="val">${stats.lastScore!=null?stats.lastScore+'%':'—'}</div></div>
      <div class="stat"><div class="lbl">Attempts</div><div class="val">${stats.totalAttempts||0}</div></div>
    </div>
    <h2>Questions by domain</h2>
    <div class="card" style="padding:0;overflow:hidden;">
      <table><thead><tr><th>Domain</th><th>Available</th><th>Your accuracy</th></tr></thead>
      <tbody>${domainRows}</tbody></table>
    </div>
    ${weakPills?`<h2>Weakest domains</h2><div class="card">${weakPills}</div>`:''}
    ${typePills?`<h2>Weakest question types</h2><div class="card">${typePills}</div>`:''}
    <h2>Study loop</h2>
    <div class="card">
      <div class="flex">
        <button onclick="goSetup()">New quiz</button>
        <button class="sec" onclick="goSetup('weak')">Drill weak areas</button>
        <button class="sec" onclick="goSetup('missed')">Retake missed</button>
        <button class="sec" onclick="goSetup('full')">Full 170-Q mock exam</button>
      </div>
    </div>`;
}

// ── SETUP ─────────────────────────────────────────────────────────────────────
function goSetup(preset){
  S.screen='setup';
  if(preset==='weak'){S.weakOnly=true;S.missedOnly=false;S.markedOnly=false;}
  else if(preset==='missed'){S.missedOnly=true;S.weakOnly=false;S.markedOnly=false;}
  else if(preset==='full'){S.examType='full';S.mode='exam';}
  else{S.weakOnly=false;S.missedOnly=false;S.markedOnly=false;S.examType='custom';S.mode='easy';}
  render();
}

function renderSetup(root){
  root.innerHTML=`
    <h1>Set up your quiz</h1>
    <div class="card">
      <h2 style="margin-top:0">Mode</h2>
      <div class="flex">
        <button id="btn-easy" onclick="S.mode='easy';syncSetup()" ${S.mode==='easy'?'':'class="sec"'}>Easy (tips + reveal)</button>
        <button id="btn-exam" onclick="S.mode='exam';syncSetup()" ${S.mode==='exam'?'':'class="sec"'}>Real Exam (timed, no hints)</button>
      </div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Scope</h2>
      <div class="flex" style="margin-bottom:14px;">
        <button id="btn-custom" onclick="S.examType='custom';syncSetup()" ${S.examType==='custom'?'':'class="sec"'}>Custom quiz</button>
        <button id="btn-full" onclick="S.examType='full';syncSetup()" ${S.examType==='full'?'':'class="sec"'}>Full 170-Q mock exam</button>
      </div>
      <div id="count-row" style="${S.examType==='full'?'display:none':''}">
        <label class="muted" style="display:block;margin-bottom:6px;">Number of questions</label>
        <input type="number" id="qcount" min="5" max="300" value="${S.count}" onchange="S.count=Number(this.value)">
      </div>
      <p class="section-label" style="margin-top:14px;">Domains (empty = all, domain-weighted)</p>
      <div class="toggle-group" id="domain-toggles">
        ${[1,2,3,4,5,6].map(d=>`<button id="dtog-${d}" onclick="toggleDomain(${d})" class="${S.domains.includes(d)?'':'sec'}">D${d}</button>`).join('')}
      </div>
      <p class="section-label">Difficulty (empty = all)</p>
      <div class="toggle-group" id="diff-toggles">
        ${['easy','medium','hard','brutal'].map(d=>`<button id="diftog-${d}" onclick="toggleDiff('${d}')" class="${S.difficulty.includes(d)?'':'sec'}">${d}</button>`).join('')}
      </div>
      <div class="chk-row"><input type="checkbox" id="chk-missed" ${S.missedOnly?'checked':''} onchange="S.missedOnly=this.checked"><label for="chk-missed">Missed questions only</label></div>
      <div class="chk-row"><input type="checkbox" id="chk-marked" ${S.markedOnly?'checked':''} onchange="S.markedOnly=this.checked"><label for="chk-marked">Marked for review only</label></div>
      <div class="chk-row"><input type="checkbox" id="chk-weak" ${S.weakOnly?'checked':''} onchange="S.weakOnly=this.checked"><label for="chk-weak">Focus on weakest domains</label></div>
      <div class="chk-row"><input type="checkbox" id="chk-shuffle" ${S.shuffleChoices?'checked':''} onchange="S.shuffleChoices=this.checked"><label for="chk-shuffle">Shuffle answer choices</label></div>
    </div>
    <div id="setup-error" class="card" style="display:none;border-color:var(--bad);color:var(--bad);"></div>
    <button onclick="startQuiz()">Start quiz</button>`;
}

function syncSetup(){
  e$('#btn-easy').className=S.mode==='easy'?'':'sec';
  e$('#btn-exam').className=S.mode==='exam'?'':'sec';
  e$('#btn-custom').className=S.examType==='custom'?'':'sec';
  e$('#btn-full').className=S.examType==='full'?'':'sec';
  const cr=e$('#count-row');
  if(cr) cr.style.display=S.examType==='full'?'none':'';
}
function toggleDomain(d){
  S.domains=S.domains.includes(d)?S.domains.filter(x=>x!==d):[...S.domains,d];
  const b=e$(`#dtog-${d}`);if(b)b.className=S.domains.includes(d)?'':'sec';
}
function toggleDiff(d){
  S.difficulty=S.difficulty.includes(d)?S.difficulty.filter(x=>x!==d):[...S.difficulty,d];
  const b=e$(`#diftog-${d}`);if(b)b.className=S.difficulty.includes(d)?'':'sec';
}

function startQuiz(){
  const result=sampleQuestions();
  if(result.error){
    const errEl=e$('#setup-error');
    if(errEl){errEl.style.display='';errEl.textContent=result.error;}
    return;
  }
  S.questions=result.questions;
  S.idx=0;
  S.answers={};
  S.timerSecs=null;
  clearInterval(S.timerInterval);
  S.screen='quiz';
  render();
  if(S.mode==='exam'&&S.examType==='full') startTimer(210*60);
  else if(S.mode==='exam') startTimer(S.questions.length*75);
}

// ── QUIZ ─────────────────────────────────────────────────────────────────────
function renderQuiz(root){
  const q=S.questions[S.idx];
  if(!q){root.innerHTML='<div class="card">No question found.</div>';return;}
  const a=S.answers[q.id]||{};
  const prog=Math.round(((S.idx+1)/S.questions.length)*100);
  const answered=Object.keys(S.answers).filter(id=>S.answers[id].selected).length;
  const markedCount=Object.keys(S.answers).filter(id=>S.answers[id].marked).length;

  root.innerHTML=`
    <div class="flex-between" style="margin-bottom:10px;">
      <div class="flex">
        <span class="pill ${S.mode==='easy'?'easy':'exam'}">${S.mode==='easy'?'Easy Mode':'Exam Mode'}</span>
        <span class="q-meta">Q ${S.idx+1}/${S.questions.length} &middot; D${q.domain} ${DOMAIN_NAMES[q.domain]||''}</span>
      </div>
      <div class="flex">
        ${S.timerSecs!=null?`<span class="pill warn" id="quiz-timer">${fmtTime(S.timerSecs)}</span>`:''}
        <span class="muted">Answered ${answered}/${S.questions.length}</span>
        ${markedCount?`<span class="muted">&middot; Marked ${markedCount}</span>`:''}
      </div>
    </div>
    <div class="progress"><div class="fill" style="width:${prog}%"></div></div>
    <div class="card">
      <div class="q-meta">${q.type.replace(/_/g,' ')} &middot; ${q.difficulty}</div>
      <p class="q-text">${escHtml(q.text)}</p>
      <div class="choices" id="choices">
        ${q.choices.map((c,i)=>{
          let cls='choice';
          if(a.selected===c.id) cls+=' sel';
          if(a.revealed){
            if(c.correct) cls=cls.replace(' sel','')+' correct';
            else if(a.selected===c.id) cls+=' wrong';
          }
          return`<div class="${cls}" onclick="selectChoice('${q.id}','${c.id}')">
            <span class="letter">${String.fromCharCode(65+i)}.</span><span>${escHtml(c.text)}</span>
          </div>`;
        }).join('')}
      </div>
      ${S.mode==='easy'&&!a.revealed?`<button class="sec" onclick="revealAnswer('${q.id}')">Reveal answer &amp; explanation</button>`:''}
      ${a.revealed?renderExplanation(q,a):''}
      <div class="nav-row">
        <div class="flex">
          <button class="sec" onclick="navQ(-1)" ${S.idx===0?'disabled':''}>← Prev</button>
          <button class="sec" onclick="navQ(1)" ${S.idx===S.questions.length-1?'disabled':''}>Next →</button>
        </div>
        <div class="flex">
          <button class="sec" onclick="clearAnswer('${q.id}')">Clear</button>
          <button class="sec" onclick="toggleMark('${q.id}')">${a.marked?'Unmark':'Mark for review'}</button>
          <button class="danger" onclick="confirmSubmit()">Submit</button>
        </div>
      </div>
      <p class="muted" style="margin-top:10px;">Keys: <kbd>1</kbd>–<kbd>4</kbd> select &nbsp;<kbd>N</kbd> next &nbsp;<kbd>P</kbd> prev &nbsp;<kbd>M</kbd> mark &nbsp;<kbd>C</kbd> clear</p>
    </div>
    <div id="confirm-submit" style="display:none;" class="card">
      <p>You've answered ${answered}/${S.questions.length} questions. ${S.questions.length-answered>0?`${S.questions.length-answered} unanswered will count as incorrect. `:''}Submit now?</p>
      <div class="flex"><button onclick="submitQuiz(false)">Yes, submit</button><button class="sec" onclick="e$('#confirm-submit').style.display='none'">Keep working</button></div>
    </div>`;

  // Keyboard shortcuts
  window.onkeydown=function(e){
    if(['1','2','3','4'].includes(e.key)){
      const c=S.questions[S.idx]?.choices[Number(e.key)-1];
      if(c) selectChoice(S.questions[S.idx].id,c.id);
    } else if(e.key.toLowerCase()==='n') navQ(1);
    else if(e.key.toLowerCase()==='p') navQ(-1);
    else if(e.key.toLowerCase()==='m') toggleMark(S.questions[S.idx]?.id);
    else if(e.key.toLowerCase()==='c') clearAnswer(S.questions[S.idx]?.id);
  };
}

function renderExplanation(q,a){
  const correctChoice=q.choices.find(c=>c.correct);
  return`<div class="tip-box">
    <strong>Correct answer: ${correctChoice?.id}. ${escHtml(correctChoice?.text||'')}</strong><br><br>
    ${q.explanation?escHtml(q.explanation):''}
    ${q.tip?`<br><br><strong>Tip:</strong> ${escHtml(q.tip)}`:''}
  </div>
  ${q.trap?`<div class="trap-box"><strong>Exam trap:</strong> ${escHtml(q.trap)}</div>`:''}`;
}

function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function selectChoice(qid,cid){
  S.answers[qid]={...(S.answers[qid]||{}),selected:cid};
  if(S.screen==='quiz') renderQuiz(document.querySelector('#app>div:last-child'));
}
function clearAnswer(qid){S.answers[qid]={...(S.answers[qid]||{}),selected:null};if(S.screen==='quiz') renderQuiz(document.querySelector('#app>div:last-child'));}
function toggleMark(qid){if(!qid)return;S.answers[qid]={...(S.answers[qid]||{}),marked:!(S.answers[qid]?.marked)};if(S.screen==='quiz') renderQuiz(document.querySelector('#app>div:last-child'));}
function revealAnswer(qid){S.answers[qid]={...(S.answers[qid]||{}),revealed:true};if(S.screen==='quiz') renderQuiz(document.querySelector('#app>div:last-child'));}
function navQ(delta){S.idx=Math.max(0,Math.min(S.questions.length-1,S.idx+delta));renderQuiz(document.querySelector('#app>div:last-child'));}
function confirmSubmit(){const d=e$('#confirm-submit');if(d)d.style.display='';}

function submitQuiz(autoSubmit){
  clearInterval(S.timerInterval);
  window.onkeydown=null;
  const results=computeResults();
  persistStats(results);
  S.results=results;
  S.screen='results';
  render();
}

// ── RESULTS ───────────────────────────────────────────────────────────────────
function renderResults(root){
  const r=S.results;
  if(!r){root.innerHTML='<div class="card">No results found.</div>';return;}
  const domRows=Object.entries(r.domainMap).sort((a,b)=>a[0]-b[0]).map(([d,v])=>{
    const acc=v.total?Math.round((v.correct/v.total)*1000)/10:0;
    return`<tr><td>D${d}. ${DOMAIN_NAMES[d]||''}</td><td>${v.correct}/${v.total}</td><td>${acc}%</td></tr>`;
  }).join('');
  const typeRows=Object.entries(r.typeMap).sort().map(([t,v])=>{
    const acc=v.total?Math.round((v.correct/v.total)*1000)/10:0;
    return`<tr><td>${t.replace(/_/g,' ')}</td><td>${v.correct}/${v.total}</td><td>${acc}%</td></tr>`;
  }).join('');

  root.innerHTML=`
    <h1>Results</h1>
    <div class="grid2">
      <div class="stat"><div class="lbl">Score</div><div class="val">${r.scorePercent}%</div></div>
      <div class="stat"><div class="lbl">Pass estimate</div><div class="val"><span class="badge ${r.passEstimate?'pass':'fail'}">${r.passEstimate?'Likely Pass':'Likely Fail'}</span></div></div>
      <div class="stat"><div class="lbl">Correct</div><div class="val">${r.correct}/${r.total}</div></div>
      <div class="stat"><div class="lbl">Unanswered</div><div class="val">${r.unanswered}</div></div>
    </div>
    <p class="muted" style="margin-bottom:16px;">Pass estimate is a heuristic (~75% raw accuracy), not ISACA's official scaled-scoring formula.</p>
    ${r.traps.length?`<div class="card" style="border-color:var(--warn);">⚠️ You missed <strong>${r.traps.length}</strong> trap question(s). Review them in the question breakdown below.</div>`:''}
    <h2>Domain breakdown</h2>
    <div class="card" style="padding:0;overflow:hidden;"><table><thead><tr><th>Domain</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${domRows}</tbody></table></div>
    <h2>Question type breakdown</h2>
    <div class="card" style="padding:0;overflow:hidden;"><table><thead><tr><th>Type</th><th>Correct</th><th>Accuracy</th></tr></thead><tbody>${typeRows}</tbody></table></div>
    <h2>Study loop</h2>
    <div class="card"><div class="flex">
      <button onclick="goSetup('missed')">Retake missed</button>
      <button class="sec" onclick="goSetup('weak')">Drill weakest</button>
      <button class="sec" onclick="goSetup()">New quiz</button>
      <button class="sec" onclick="goSetup('full')">Full mock exam</button>
    </div></div>
    <h2>Question review</h2>
    <div class="card">
      <button class="sec" onclick="toggleReview()">Show/hide full review</button>
      <div id="review-panel" style="display:none;margin-top:16px;">${renderReview()}</div>
    </div>`;
}

function toggleReview(){const p=e$('#review-panel');if(p)p.style.display=p.style.display==='none'?'':'none';}

function renderReview(){
  return S.questions.map((q,i)=>{
    const a=S.answers[q.id]||{};
    const correctChoice=q.choices.find(c=>c.correct);
    const selectedChoice=a.selected?q.choices.find(c=>c.id===a.selected):null;
    const isCorrect=selectedChoice?.correct;
    return`<div class="review-q">
      <p class="muted">Q${i+1} &middot; D${q.domain} &middot; ${q.type.replace(/_/g,' ')} &middot; <span class="${isCorrect?'correct-mark':'wrong-mark'}">${isCorrect?'✓ Correct':'✗ Missed'}${!a.selected?' (unanswered)':''}</span></p>
      <p style="margin:6px 0;font-size:.9rem;line-height:1.6;">${escHtml(q.text)}</p>
      <ul style="list-style:none;margin:8px 0;display:flex;flex-direction:column;gap:4px;">
        ${q.choices.map(c=>`<li style="font-size:.85rem;padding:4px 8px;border-radius:4px;background:${c.correct?'rgba(63,185,127,.1)':c.id===a.selected?'rgba(226,87,76,.1)':'transparent'};color:${c.correct?'var(--good)':c.id===a.selected&&!c.correct?'var(--bad)':'var(--dim)'};">
          ${c.id}. ${escHtml(c.text)}${c.correct?' ✓':''}${c.id===a.selected&&!c.correct?' (your answer)':''}
        </li>`).join('')}
      </ul>
      ${q.explanation?`<p style="font-size:.83rem;color:var(--dim);margin-top:6px;">${escHtml(q.explanation)}</p>`:''}
      ${q.trap?`<div class="trap-box" style="margin-top:8px;font-size:.82rem;"><strong>Trap:</strong> ${escHtml(q.trap)}</div>`:''}
    </div>`;
  }).join('');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Pre-generate questions in background so first quiz starts instantly
setTimeout(()=>getAllQuestions(),300);
render();
</script>
</body>
</html>
