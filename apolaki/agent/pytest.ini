[pytest]
# The suite is pytest-style (plain test_* functions, not unittest.TestCase), so
# `python -m unittest discover` finds 0 tests — use pytest. With this file present
# `python -m pytest` from /app auto-discovers tests/ and conftest.py adds the flat
# agent modules to sys.path.
testpaths = tests
python_files = test_*.py
addopts = -q
