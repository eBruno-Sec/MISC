services:
  agent:
    build: ./agent
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      # Generic AI config (preferred). Provider-specific vars below still win if set.
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      # Provider-specific (optional; take precedence over the generic AI_* above).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # 0 = HITL intrusive gate waits forever; >0 = auto-deny after N seconds
      - BBH_APPROVAL_TIMEOUT=${BBH_APPROVAL_TIMEOUT:-0}
      # Native OOB collaborator for blind SSRF/XXE confirmation. Empty = OOB stays
      # advisory. Set to the agent's externally-reachable base URL so targets can
      # call back, e.g. https://oob.you.example . Optional wildcard-DNS domain in
      # BBH_OOB_DOMAIN enables DNS-triggerable subdomain probes.
      # Default to the agent's IN-NETWORK address so the blind classes (blind SSRF/XXE/cmdi,
      # second-order + OOB SQLi) are confirmable against the local labs out of the box. This URL is
      # only reachable from inside this network -- collaborator.reachable_from() enforces that, so an
      # EXTERNAL engagement still reports those classes as untestable rather than silently untested.
      # Override with a public collaborator URL for external work.
      - BBH_OOB_BASE=${BBH_OOB_BASE:-http://agent:8000}
      - BBH_OOB_DOMAIN=${BBH_OOB_DOMAIN:-}
      # GitHub recon: YOUR OWN read-only PAT (no scopes needed), only to lift the
      # code-search rate limit. Empty = run_github_recon skips cleanly.
      - BBH_GITHUB_TOKEN=${BBH_GITHUB_TOKEN:-}
      # LINODE_TOKEN: a READ-ONLY Linode (Akamai Connected Cloud) API token enables the live cloud
      # posture review at GET /cloud/posture/linode. Put it in a gitignored .env, never commit it.
      # Empty = the endpoint reports blocked cleanly.
      - LINODE_TOKEN=${LINODE_TOKEN:-}
      # OWASP ZAP DAST. The zap service is OPT-IN (profile "dast", ~1GB idle) — start it with
      # `docker compose --profile dast up -d zap` and the agent auto-detects it here. ZAP only
      # actually RUNS when the user also ticks "Enable ZAP" in the scan setup; if the profile
      # isn't up, an enabled-ZAP scan degrades gracefully (or blocks if require_zap).
      - ZAP_ADDR=${ZAP_ADDR:-http://zap:8090}
      - ZAP_API_KEY=${ZAP_API_KEY:-bbh-zap}
      # OAST for blind/OOB vulns (SSRF/XXE/RCE). Empty = off. e.g. BOAST or Interactsh
      - ZAP_OAST_SERVICE=${ZAP_OAST_SERVICE:-}
      # Headless-browser engine (browser_engine.py) + CDP collector (cdp.py). Points at the optional
      # headless-chrome sidecar; when that profile isn't running it just degrades gracefully (unreachable
      # -> empty result), so the HTTP engine is never affected. Enable the browser world with:
      #   docker compose --profile browser up -d headless-chrome
      - CDP_BROWSER_URL=${CDP_BROWSER_URL:-http://headless-chrome:3000}
      # Offensive intel feeds (Phase 0): the intel-feeds sidecar writes KEV/CAPEC snapshots here and
      # the agent reads them to enrich the technique registry (known-exploited flags, CAPEC patterns).
      - INTEL_FEEDS_DIR=/app/data/intel_feeds
      # Phase 1 first-class Technique store (ingested candidates + human-review decisions). Agent-writable.
      - TECHNIQUE_STORE_DIR=/app/data/techniques
      # Attack-chain memory: per-target record of what was tried/worked/failed (feeds the planner). Agent-writable.
      - ATTACK_CHAIN_DIR=/app/data/attack_chains
      # Intercept proxy (proxy.py): the optional mitmproxy sidecar streams captured flows here and reads
      # the match-and-replace rules the agent writes here. When PROXY_URL is set, the browser engine
      # auto-routes the headless browser through it. Empty PROXY_URL = proxy features degrade to labelled
      # empty (the HTTP + browser engines are unaffected). Enable with:
      #   docker compose --profile proxy up -d mitmproxy
      - PROXY_URL=${PROXY_URL:-http://mitmproxy:8080}
      - PROXY_FLOWS_DIR=/app/data/proxy
    ports:
      # LOCAL-ONLY by default (matches the platform_auth local-only default). Expose externally only
      # by explicit opt-in: APOLAKI_BIND=0.0.0.0 (and set APOLAKI_API_TOKEN when you do).
      - "${APOLAKI_BIND:-127.0.0.1}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./ui:/app/ui:ro
      - nuclei_templates:/root/nuclei-templates
      - bbh_data:/app/data
      - intel_feeds_data:/app/data/intel_feeds
      - proxy_data:/app/data/proxy
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # OWASP ZAP daemon for the run_zap DAST tool. OPT-IN (profile "dast") — ~1GB RAM, ~40s
  # first-boot while add-ons load, so it no longer runs by default. Bring it up only when you
  # want DAST: `docker compose --profile dast up -d zap`; the agent then auto-detects it.
  zap:
    image: ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2
    profiles: ["dast"]              # ~1GB idle; opt-in. Enable with: docker compose --profile dast up -d zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-bbh-zap}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY:-bbh-zap}"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Benchmark / lab targets (public images, pulled on `up`; NOT real engagements) ──
  # OWASP Juice Shop, reachable at http://juice-shop:3000 on the compose network — used by
  # Lab Mode (the ▶ Solve button), the Conquest tab, and general-scan benchmarks. safetyMode
  # is disabled so the full XSS/NoSQL challenge set is reachable. No source is vendored: this
  # just runs the public image.
  juice-shop:
    image: bkimminich/juice-shop@sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
    environment:
      - 'NODE_CONFIG={"challenges":{"safetyMode":"disabled"}}'
    ports:
      - "127.0.0.1:42000:3000"
    volumes:
      - juiceshop_data:/juice-shop/data
    restart: unless-stopped
    mem_limit: 3g

  # ISOLATED Juice Shop for the full-mission benchmark's --fresh-lab. Same image, but a DEDICATED
  # volume the benchmark recreates for a genuinely fresh DB (no accounts/state bleed) WITHOUT ever
  # touching the normal `juice-shop` / juiceshop_data a user works against. Opt-in via `--profile
  # bench`; reachable at http://juice-shop-bench:3000 on the compose network. See scripts/fresh_lab.sh.
  juice-shop-bench:
    profiles: ["bench"]
    image: bkimminich/juice-shop@sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
    environment:
      - 'NODE_CONFIG={"challenges":{"safetyMode":"disabled"}}'
    ports:
      - "127.0.0.1:42001:3000"
    volumes:
      - juiceshop_bench_data:/juice-shop/data
    restart: "no"
    mem_limit: 3g

  # DVWA — a SECOND lab so techniques can be validated on >=2 labs (the "generalized" bar in
  # the Taxonomy tab). One-time setup after `up`: open http://localhost:42080, click "Create
  # Database", log in admin/password, set DVWA Security = low. Reachable at http://dvwa on the
  # compose network.
  dvwa:
    image: vulnerables/web-dvwa@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    profiles: ["labs"]             # secondary cross-validation lab; opt-in via: docker compose --profile labs up -d
    ports:
      - "127.0.0.1:42080:80"
    restart: unless-stopped

  # bWAPP -- a THIRD lab, reachable at http://bwapp on the compose network. Cross-validates
  # command_injection + path_traversal + reflected_xss (the >=2-lab "generalized" bar). One-time setup
  # after `up`: GET http://localhost:42088/install.php?install=yes (creates the MySQL schema), then the
  # prover logs in bee/bug at low security. Scored via per-class response oracles (no scoreboard API).
  bwapp:
    image: raesene/bwapp@sha256:2f41183ea9f9e8fb36678d7a2a0c8a9db9a59f4569cee02fe6664b419b2600ee
    profiles: ["labs"]             # secondary cross-validation lab; opt-in via: docker compose --profile labs up -d
    ports:
      - "127.0.0.1:42088:80"
    restart: unless-stopped

  # Mutillidae (NOWASP) -- a FOURTH lab, reachable at http://mutillidae on the compose network. Its
  # oracle confirms open_redirect on a 2nd lab (Juice Shop was the 1st) -> generalized. One-time setup
  # after `up`: GET http://localhost:42089/set-up-database.php (builds the MySQL schema).
  mutillidae:
    image: citizenstig/nowasp@sha256:8bf6f283163bbc269ccfff513e4a06776325cb4957f683df9edd4ab98c6966de
    profiles: ["labs"]             # secondary cross-validation lab; opt-in via: docker compose --profile labs up -d
    ports:
      - "127.0.0.1:42089:80"
    restart: unless-stopped

  # WebGoat (OWASP) -- a FIFTH lab (Java training app). Opt-in. Reachable at http://webgoat:8080 on
  # the compose network; host http://localhost:42084/WebGoat. Local-only bind. No manual setup.
  webgoat:
    image: webgoat/webgoat@sha256:3101bd9e7bcfe122d7ef91e690ef3720de36cc4e86b3d06763a1ddf2e2751a4b
    profiles: ["labs"]
    ports:
      - "127.0.0.1:42084:8080"
    restart: unless-stopped

  # VAmPI (OWASP-style vulnerable REST API) -- API-focused lab. Reachable at http://vampi:5000 on the
  # compose network; host http://localhost:42091. Exercises the API half: BOLA/broken-auth (JWT),
  # mass-assignment, excessive-data-exposure. No manual setup (in-memory SQLite seeds on boot).
  vampi:
    image: erev0s/vampi:latest
    profiles: ["labs"]
    ports:
      - "127.0.0.1:42091:5000"
    restart: unless-stopped

  # DVGA (Damn Vulnerable GraphQL Application) -- GraphQL lab. Reachable at http://dvga:5013 on the
  # compose network; host http://localhost:42092. Cross-validates run_graphql (introspection, batching,
  # injection, DoS-guarded) on a 2nd surface beyond Juice Shop's /api.
  dvga:
    image: dolevf/dvga:latest
    profiles: ["labs"]
    environment:
      - WEB_HOST=0.0.0.0            # app.py defaults to 127.0.0.1 (container-local) -> bind on all ifaces so the agent can reach it
    ports:
      - "127.0.0.1:42092:5013"
    restart: unless-stopped

  # clientauthz -- the validation lab for the two BIE engines that had no target exhibiting their bug:
  # client_side_authz (CWE-602) and client_supplied_identity_param (CWE-639). Juice Shop cannot serve as one
  # (Angular REMOVES privileged controls from the DOM rather than hiding them, and identifies objects by path
  # segment, not by an identity parameter), so both engines correctly reported zero there -- which proves
  # nothing either way. Reachable at http://clientauthz:8080 on the compose network; host 42093.
  #
  # It carries a VULNERABLE and a SECURE variant of each class, deliberately paired, so a run exercises the
  # oracles' false-positive guards and not just their detection. Stdlib-only Python: no build, no
  # dependency to install, nothing that can rot from an upstream change.
  clientauthz:
    image: python:3.12-slim
    profiles: ["labs"]
    working_dir: /lab
    command: python app.py
    volumes:
      - ./labs/clientauthz:/lab:ro
    ports:
      - "127.0.0.1:42093:8080"
    restart: unless-stopped

  # OWASP Benchmark -- the only target here with per-test-case ground truth that includes DELIBERATE
  # FALSE POSITIVES (1415 real / 1325 fake across 2740 cases). ginandjuice's key lists only real
  # vulnerabilities, so precision there is inferred; this measures it directly.
  #
  # Serves HTTPS on 8443 (NOT http/8080 -- 8080 is refused). Reachable at https://owaspbench:8443/benchmark/
  # on the compose network; host 42095. Self-signed cert, so scans need verify=False.
  #
  # 1639 of the 2740 cases are crawlable black-box, all linked from <category>-Index.html:
  #   sqli 504 | xss 455 | pathtraver 268 | cmdi 251 | securecookie 67 | ldapi 59 | xpathi 35
  # The other 1101 (weakrand, crypto, hash, trustbound) are code-level properties no black-box scanner
  # can observe -- they are SAST cases and Apolaki should never be scored against them.
  #
  # BLIND BY CONSTRUCTION: expectedresults-1.2.csv is a file in the container, NOT served over HTTP
  # (verified: 404 on every path). The scanner cannot crawl the answers even in principle, so unlike
  # ginandjuice no answer-key path needs blocking. Read it with `docker exec`, after the mission seals.
  #
  # Startup runs `mvn clean package cargo:run`, ~90s before it answers. Not a fast lab.
  owaspbench:
    image: owasp/benchmark@sha256:a05b4659d3b489222cc1552c58497171819cc541a22568895c9134cfbf725908
    profiles: ["labs"]
    working_dir: /owasp/BenchmarkJava
    entrypoint: ["sh", "-c", "./runRemoteAccessibleBenchmark.sh -q"]
    ports:
      - "127.0.0.1:42095:8443"
    restart: unless-stopped
    mem_limit: 2g

  # domsource -- validation lab for client-side sources that never reach the server. dom_trace gained the
  # URL FRAGMENT as a source; everything after '#' is absent from the access log, from a proxy capture and
  # from any request replay, so the engine cannot be validated by checking what the server received --
  # the server received nothing. The only observation point is the rendered DOM, which is why this lab
  # exists. Carries an executable sink, a data-only sink, a query-attribution control and an inert page.
  # Reachable at http://domsource:8080 on the compose network; host 42094.
  domsource:
    image: python:3.12-slim
    profiles: ["labs"]
    working_dir: /lab
    command: python app.py
    volumes:
      - ./labs/domsource:/lab:ro
    ports:
      - "127.0.0.1:42094:8080"
    restart: unless-stopped

  # Conpot (Honeynet Project) -- the ICS/OT validation target. The beyond-web engines had only ever been
  # exercised against mocks: their frame BUILDERS are unit-proven, but parsing a reply from a stack that is
  # not ours had never happened. A simulator written with our own frame code would test the parser against
  # its own encoder and prove nothing, so this is deliberately a FOREIGN implementation.
  #
  # It speaks Modbus, S7comm, SNMP, IPMI, BACnet and EtherNet/IP, presenting as a Siemens SIMATIC S7-200
  # with a Rockwell 1756-L61/B LOGIX5561. Ports are Conpot's own unprivileged defaults, NOT the protocols'
  # standard ports, so the agent addresses them explicitly:
  #     modbus 5020 | s7comm 10201 | enip 44818 | snmp 16100/udp | ipmi 6230/udp | bacnet 47808/udp
  # DNP3 is NOT among them -- see the dnp3_exposed entry in techniques.py, which stays validated_on: []
  # rather than borrowing this lab's credibility.
  conpot:
    image: honeynet/conpot@sha256:cd93e88d9e44b020db691fc4c75cb29e76b5e90ddbc408aca26e6c78c5646976
    profiles: ["labs"]
    ports:
      - "127.0.0.1:42502:5020"      # modbus/tcp
      - "127.0.0.1:42102:10201"     # s7comm/tcp
      - "127.0.0.1:42818:44818"     # ethernet-ip/tcp
      - "127.0.0.1:42162:16100/udp" # snmp/udp
      - "127.0.0.1:42623:6230/udp"  # ipmi/udp
    restart: unless-stopped

  # DVNA (Damn Vulnerable NodeJS Application) is a valid Node lab in benchmark.MANIFESTS but is NOT wired here:
  # appsecco/dvna hard-requires a linked MySQL sibling (it wait-for-it blocks and crash-loops without one). Add a
  # `dvna` + `dvna-mysql` pair under a dedicated profile when Node/deserialization cross-validation is needed.

  # OpenLDAP — a directory lab for the beyond-web AD/LDAP engines (#105). Reachable at ldap://openldap:1389 on
  # the compose network; host 42389. ANON binding is left ON (LDAP_ALLOW_ANON_BINDING=yes, the default) so the
  # anonymous-read audit has a positive case to confirm against; seeded with two users under dc=designworld,dc=local.
  openldap:
    image: osixia/openldap:latest
    profiles: ["labs"]
    environment:
      - LDAP_ORGANISATION=Design World
      - LDAP_DOMAIN=designworld.local     # -> base DN dc=designworld,dc=local; osixia allows anonymous read by default
      - LDAP_ADMIN_PASSWORD=adminpw
    ports:
      - "127.0.0.1:42389:389"
    restart: unless-stopped

  # Samba — an SMB/file-server lab for the beyond-web SMB engine (#105). Reachable at smb://smb:445 on the
  # compose network; host 42445. Configured to MAP anonymous sessions to guest + a guest-readable "public" share,
  # so the null-session share-enumeration audit has a positive case to confirm against (mirrors DW-FS).
  smb:
    image: dperson/samba:latest
    profiles: ["labs"]
    command: -p -n -g "map to guest = Bad User" -g "server min protocol = NT1" -g "ntlm auth = yes" -s "public;/share;yes;no;yes;all" -u "jdoe;Passw0rd1"
    ports:
      - "127.0.0.1:42445:445"
    restart: unless-stopped

  # snmpd — an SNMP agent lab for the beyond-web SNMP engine (#105). Reachable at snmp://snmpd:161/udp on the
  # compose network; host 42161/udp. Ships the default RO community 'public', so the default-community audit has
  # a positive case to confirm against (mirrors a router/switch/printer/hypervisor on the DW network).
  snmpd:
    image: polinux/snmpd:latest
    profiles: ["labs"]
    ports:
      - "127.0.0.1:42161:161/udp"
    restart: unless-stopped

  # OPTIONAL headless Chrome for the CDP RUNTIME collector (agent/cdp.py) — collects service
  # workers, runtime XHR/GraphQL endpoints, lazy JS chunks and storage a curl can't see. NOT in
  # the default stack (heavy). Activate with:
  #   docker compose --profile browser up -d headless-chrome
  #   (and set CDP_BROWSER_URL=http://headless-chrome:3000 for the agent)
  headless-chrome:
    image: ghcr.io/browserless/chromium@sha256:07f6561d607b80312cc9b2500e98e40cf1eb0276fb647984fa074c96b9dd41dc
    profiles: ["browser"]
    environment:
      - CONCURRENT=2
      - TIMEOUT=30000
    expose:
      - "3000"
    restart: unless-stopped

  # OPTIONAL intercepting proxy (proxy.py) -- Apolaki's Burp/ZAP-core man-in-the-middle. mitmdump loads
  # the Apolaki addon (mitm_addon.py, mounted read-only from ./agent): it streams every redacted flow to
  # the shared proxy_data volume and applies the match-and-replace rules file the agent writes there. The
  # browser engine auto-routes through it (Chrome --proxy-server) when PROXY_URL is set on the agent. NOT
  # in the default stack. Activate with:
  #   docker compose --profile proxy up -d mitmproxy
  # (bring up the browser too for full capture: `--profile browser --profile proxy up -d`)
  mitmproxy:
    image: mitmproxy/mitmproxy@sha256:00b77b5d8804c8ad18cb6caefbf9d5849e895e8986c5ce011f4ae30f4385962f
    profiles: ["proxy"]
    # The image entrypoint gosu-drops to the unprivileged `mitmproxy` user, which can't write the
    # root-owned shared volume (the addon's flow writes would be silently denied). Override the entrypoint
    # to make /data writable and run mitmdump directly so the addon can stream flows to the shared volume.
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "mkdir -p /data && chmod 0777 /data && exec mitmdump --listen-host 0.0.0.0 -p 8080 -s /addon/mitm_addon.py --set termlog_verbosity=info"
    environment:
      - PROXY_FLOWS_DIR=/data
    volumes:
      - ./agent/mitm_addon.py:/addon/mitm_addon.py:ro
      - proxy_data:/data
    expose:
      - "8080"
    restart: unless-stopped

  # Offensive intel feeds (Phase 0): an INDEPENDENT deterministic ingestion service. Pulls Tier-A,
  # redistributable sources (CISA KEV + MITRE CAPEC) on a schedule and writes normalized JSON
  # snapshots to a shared volume; the agent reads them to enrich the technique registry with
  # known-exploited-in-the-wild flags + CAPEC attack patterns. No crawl, no LLM, nothing auto-fires.
  # Reuses the agent image, just a different entrypoint. Last arg = refresh interval in seconds (6h).
  intel-feeds:
    build: ./agent
    command: ["python", "-m", "intel_feeds", "serve", "/app/data/intel_feeds", "21600"]
    environment:
      - INTEL_FEEDS_DIR=/app/data/intel_feeds
      # Set INTEL_FEEDS_ATTACK=1 to also pull the (large ~47MB) MITRE ATT&CK Enterprise STIX bundle.
      - INTEL_FEEDS_ATTACK=${INTEL_FEEDS_ATTACK:-}
    volumes:
      - intel_feeds_data:/app/data/intel_feeds
    restart: unless-stopped

volumes:
  nuclei_templates:
  bbh_data:
  juiceshop_data:
  juiceshop_bench_data:      # dedicated to juice-shop-bench; recreated by --fresh-lab, never the user's data
  intel_feeds_data:
  proxy_data:
