services:
  agent:
    build: ./agent
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      # Generic AI config (preferred). Provider-specific vars below still win if set.
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      # Provider-specific (optional; take precedence over the generic AI_* above).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      # 0 = HITL intrusive gate waits forever; >0 = auto-deny after N seconds
      - BBH_APPROVAL_TIMEOUT=${BBH_APPROVAL_TIMEOUT:-0}
      # Native OOB collaborator for blind SSRF/XXE confirmation. Empty = OOB stays
      # advisory. Set to the agent's externally-reachable base URL so targets can
      # call back, e.g. https://oob.you.example . Optional wildcard-DNS domain in
      # BBH_OOB_DOMAIN enables DNS-triggerable subdomain probes.
      - BBH_OOB_BASE=${BBH_OOB_BASE:-}
      - BBH_OOB_DOMAIN=${BBH_OOB_DOMAIN:-}
      # GitHub recon: YOUR OWN read-only PAT (no scopes needed), only to lift the
      # code-search rate limit. Empty = run_github_recon skips cleanly.
      - BBH_GITHUB_TOKEN=${BBH_GITHUB_TOKEN:-}
      # OWASP ZAP DAST. The zap service below starts by default, so ZAP is AVAILABLE
      # at deployment and the agent auto-detects it here (no manual ZAP_ADDR editing).
      # ZAP is only USED when the user ticks "Enable ZAP" in the scan setup — so a
      # default scan costs nothing extra. To run WITHOUT the ZAP container, disable
      # the 'zap' service below (or `docker compose up -d --scale zap=0`).
      - ZAP_ADDR=${ZAP_ADDR:-http://zap:8090}
      - ZAP_API_KEY=${ZAP_API_KEY:-bbh-zap}
      # OAST for blind/OOB vulns (SSRF/XXE/RCE). Empty = off. e.g. BOAST or Interactsh
      - ZAP_OAST_SERVICE=${ZAP_OAST_SERVICE:-}
    ports:
      - "8000:8000"
    volumes:
      - ./ui:/app/ui:ro
      - nuclei_templates:/root/nuclei-templates
      - bbh_data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # OWASP ZAP daemon for the run_zap DAST tool. Starts by default so ZAP is
  # available at deployment; the agent only USES it when a scan enables ZAP.
  # To run a lighter stack without ZAP: `docker compose up -d --scale zap=0`
  # (or comment out this service). ~1GB RAM, ~40s first-boot while add-ons load.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-bbh-zap}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/JSON/core/view/version/?apikey=${ZAP_API_KEY:-bbh-zap}"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Benchmark / lab targets (public images, pulled on `up`; NOT real engagements) ──
  # OWASP Juice Shop, reachable at http://juice-shop:3000 on the compose network — used by
  # Lab Mode (the ▶ Solve button), the Conquest tab, and general-scan benchmarks. safetyMode
  # is disabled so the full XSS/NoSQL challenge set is reachable. No source is vendored: this
  # just runs the public image.
  juice-shop:
    image: bkimminich/juice-shop:latest
    environment:
      - 'NODE_CONFIG={"challenges":{"safetyMode":"disabled"}}'
    ports:
      - "127.0.0.1:42000:3000"
    volumes:
      - juiceshop_data:/juice-shop/data
    restart: unless-stopped
    mem_limit: 3g

  # DVWA — a SECOND lab so techniques can be validated on >=2 labs (the "generalized" bar in
  # the Taxonomy tab). One-time setup after `up`: open http://localhost:42080, click "Create
  # Database", log in admin/password, set DVWA Security = low. Reachable at http://dvwa on the
  # compose network.
  dvwa:
    image: vulnerables/web-dvwa:latest
    ports:
      - "127.0.0.1:42080:80"
    restart: unless-stopped

volumes:
  nuclei_templates:
  bbh_data:
  juiceshop_data:
