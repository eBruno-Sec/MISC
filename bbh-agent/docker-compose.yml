version: '3.9'

services:
  agent:
    build: ./agent
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      # 0 = HITL intrusive gate waits forever; >0 = auto-deny after N seconds
      - BBH_APPROVAL_TIMEOUT=${BBH_APPROVAL_TIMEOUT:-0}
      # OWASP ZAP DAST (optional). Empty ZAP_ADDR = run_zap skips cleanly.
      # To enable: docker compose --profile zap up -d  (and keep ZAP_ADDR below)
      - ZAP_ADDR=${ZAP_ADDR:-}
      - ZAP_API_KEY=${ZAP_API_KEY:-bbh-zap}
      # OAST for blind/OOB vulns (SSRF/XXE/RCE). Empty = off. e.g. BOAST or Interactsh
      - ZAP_OAST_SERVICE=${ZAP_OAST_SERVICE:-}
    ports:
      - "8000:8000"
    volumes:
      - ./ui:/app/ui:ro
      - nuclei_templates:/root/nuclei-templates
      - bbh_data:/app/data
    cap_add:
      - NET_RAW
      - NET_ADMIN

  # Optional OWASP ZAP daemon for the run_zap tool. Does NOT start by default.
  # Enable with:  ZAP_ADDR=http://zap:8090 docker compose --profile zap up -d
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: ["zap"]
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8090
      -config api.key=${ZAP_API_KEY:-bbh-zap}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    expose:
      - "8090"

volumes:
  nuclei_templates:
  bbh_data:
