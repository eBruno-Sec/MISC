name: ArsGoatia Tests

on:
  push:
    paths:
      - "arsgoatia/**"
  pull_request:
    paths:
      - "arsgoatia/**"

defaults:
  run:
    working-directory: arsgoatia

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest pytest-asyncio pytest-cov pydantic pydantic-settings \
            sqlalchemy asyncpg alembic httpx minio cryptography python-jose fastapi \
            jsonschema
      - run: python -m pytest tests/unit -q --tb=short

  contract:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings \
            sqlalchemy asyncpg alembic httpx minio cryptography python-jose fastapi \
            jsonschema
      - run: python -m pytest tests/contract tests/contracts -q --tb=short

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings \
            sqlalchemy asyncpg alembic httpx minio cryptography python-jose fastapi
      - run: python -m pytest tests/security -q --tb=short

  replay:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings \
            sqlalchemy asyncpg alembic httpx minio cryptography python-jose fastapi
      - run: python -m pytest tests/replay -q --tb=short

  integration:
    runs-on: ubuntu-latest
    needs: [unit, contract, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings \
            sqlalchemy asyncpg alembic httpx minio cryptography python-jose fastapi \
            jsonschema
      - run: python -m pytest tests/integration -q --tb=short

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    if: false  # enable when docker-compose lab profile is testable in CI
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile lab up --build -d
      - run: docker compose exec api alembic upgrade head
      - run: docker compose exec api python -m pytest tests/e2e -q --tb=short
      - run: docker compose down -v
