[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arsgoatia"
version = "0.1.0"
description = "Durable, explainable, multi-domain penetration-testing orchestration platform"
requires-python = ">=3.11"
# Full runtime dependency set for the containerized slice. CI for early
# milestones installs a targeted subset (see .github/workflows/arsgoatia-tests.yml);
# these are what the Docker images build against.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "temporalio>=1.6",
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx[http2]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Everything the test suite needs, milestone by milestone. Kept in one extra so
# `pip install -e .[test]` reproduces CI locally.
test = [
    "pytest>=8.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]
ai = [
    "openai>=1.14",
    "anthropic>=0.25",
]

# The spec repo tree keeps shared code under packages/. Each is a top-level
# importable package inside this project's environment.
[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
# packages/ holds the shared libraries; the repo root holds apps/, modules/,
# tools/, and temporal/ which tests import by their tree path.
pythonpath = ["packages", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
